plugins {
    id 'java-library'
}

description = 'Typed Cardano History predicates over the reusable Yano MPF on-chain verifier'

dependencies {
    api project(':appchain-proof-onchain')
    api project(':appchain-stdlib-contracts')
    api project(':appchain-composite-contracts')
    compileOnly "com.bloxbean.cardano:julc-stdlib:${libs.versions.julc.get()}"
    compileOnly "com.bloxbean.cardano:julc-ledger-api:${libs.versions.julc.get()}"

    testImplementation "com.bloxbean.cardano:julc-stdlib:${libs.versions.julc.get()}"
    testImplementation "com.bloxbean.cardano:julc-testkit:${libs.versions.julc.get()}"
    testImplementation "com.bloxbean.cardano:julc-ledger-api:${libs.versions.julc.get()}"
    testImplementation "com.bloxbean.cardano:julc-compiler:${libs.versions.julc.get()}"
    testRuntimeOnly "com.bloxbean.cardano:julc-vm-java:${libs.versions.julc.get()}"
    testImplementation libs.cardano.client.crypto
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.register('prepareJulcTestSources', Sync) {
    from sourceSets.main.java
    from project(':appchain-proof-onchain').sourceSets.main.java
    into layout.buildDirectory.dir('generated/julc-test-sources')
}

tasks.named('test') {
    dependsOn tasks.named('prepareJulcTestSources')
}
