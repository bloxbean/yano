plugins {
    id 'com.gradleup.shadow'
}

dependencies {
    compileOnly project(':core-api')
    implementation(project(':appchain-eutxo-ledger')) {
        transitive = false
    }
    implementation(project(':appchain-eutxo-contracts')) {
        transitive = false
    }
    implementation(project(':appchain-eutxo-zk-contracts')) {
        transitive = false
    }
    implementation project(':appchain-eutxo-zk-zeroj')

    compileOnly libs.cardano.client.core
    compileOnly libs.cardano.client.crypto
    compileOnly libs.scalus.bloxbean.ccl
    compileOnly libs.scalus.cardano.ledger
    compileOnly libs.scala3.library
    compileOnly libs.cbor

    testImplementation project(':core-api')
    testImplementation project(':runtime')
    testImplementation libs.cardano.client.core
    testImplementation libs.cardano.client.crypto
    testImplementation libs.scalus.bloxbean.ccl
    testImplementation libs.scalus.cardano.ledger
    testImplementation libs.scala3.library
    testImplementation libs.cbor
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.named('shadowJar') {
    archiveBaseName.set("yano-${project.name}")
    archiveClassifier.set('bundle')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    exclude 'com/bloxbean/cardano/yano/api/**'
    exclude 'META-INF/yano/plugins/com.bloxbean.cardano.yano.appchain.eutxo.json'
    exclude 'META-INF/services/com.bloxbean.cardano.yano.appchain.eutxo.contracts.EutxoValidityCommitmentProvider'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}

tasks.register('verifyEutxoZkRuntimeBundle') {
    group = 'verification'
    description = 'Verifies the stock JVM EUTxO-ZK runtime bundle owns both runtime providers'
    dependsOn tasks.named('shadowJar')
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })

    doLast {
        def archive = tasks.named('shadowJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def entries = zip.entries().collect { it.name }.toSet()
            [
                    'com/bloxbean/cardano/yano/appchain/eutxo/zk/runtime/EutxoZkStateMachineProvider.class',
                    'com/bloxbean/cardano/yano/appchain/eutxo/zk/zeroj/ZerojPoseidonValidityProvider.class',
                    'META-INF/services/com.bloxbean.cardano.yano.api.appchain.AppStateMachineProvider'
            ].each { required ->
                if (!entries.contains(required)) {
                    throw new GradleException(
                            "EUTxO-ZK runtime bundle is missing ${required}")
                }
            }
            def providerEntry = zip.getEntry(
                    'META-INF/services/com.bloxbean.cardano.yano.api.appchain.AppStateMachineProvider')
            def providers = zip.getInputStream(providerEntry).getText('UTF-8')
                    .readLines().findAll { !it.isBlank() }
            if (providers != [
                    'com.bloxbean.cardano.yano.appchain.eutxo.zk.runtime.EutxoZkStateMachineProvider'
            ]) {
                throw new GradleException(
                        "EUTxO-ZK runtime bundle has unexpected state-machine providers: ${providers}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyEutxoZkRuntimeBundle')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano App-Chain EUTxO ZeroJ Runtime'
                description = 'Integrated JVM plugin bundle for the EUTxO ledger and ZeroJ validity provider'
            }
        }
    }
}
