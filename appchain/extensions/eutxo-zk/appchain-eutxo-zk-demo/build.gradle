plugins {
    id 'java-library'
}

dependencies {
    implementation project(':appchain-eutxo-demo')
    implementation project(':appchain-eutxo-zk-client')
    implementation project(':appchain-eutxo-zk-lifecycle')
    implementation libs.jackson.databind

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano App-Chain EUTxO ZK Demo'
                description = 'Optional disposable ZeroJ EUTxO demo provider'
            }
        }
    }
}
