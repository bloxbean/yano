plugins {
    id 'com.gradleup.shadow'
}

dependencies {
    compileOnly project(':core-api')
    implementation(project(':appchain-eutxo-contracts')) {
        transitive = false
    }
    // SP-M4 nullifier mirror (MPF trie) for the wired settle pipeline.
    implementation project(':appchain-eutxo-client')
    compileOnly libs.yaci.core
    compileOnly libs.cardano.client.core
    compileOnly libs.cardano.client.address
    compileOnly libs.cardano.client.common
    compileOnly libs.cardano.client.quicktx
    compileOnly libs.cbor
    implementation libs.jackson.databind

    testImplementation project(':core-api')
    testImplementation project(':appchain-eutxo-testkit')
    testImplementation libs.yaci.core
    testImplementation libs.cardano.client.core
    testImplementation libs.cardano.client.address
    testImplementation libs.cardano.client.common
    testImplementation libs.cardano.client.quicktx
    testImplementation libs.cbor
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.named('shadowJar') {
    archiveBaseName.set("yano-${project.name}")
    archiveClassifier.set('bundle')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    mergeServiceFiles()
    exclude 'com/bloxbean/cardano/yano/api/**'
    exclude 'com/bloxbean/cardano/yaci/**'
    exclude 'com/bloxbean/cardano/client/**'
    exclude 'co/nstant/in/cbor/**'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}

tasks.register('verifyEutxoBridgeArtifactBoundaries') {
    group = 'verification'
    description = 'Verifies the optional bridge bundle embeds contracts but no host, Cardano, Julc, or ZeroJ classes'
    dependsOn tasks.named('jar'), tasks.named('shadowJar')
    inputs.files(tasks.named('jar').flatMap { it.archiveFile },
            tasks.named('shadowJar').flatMap { it.archiveFile })

    doLast {
        def entries = { File archive ->
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().collect { entry -> entry.name }.toSet()
            }
        }
        def thinEntries = entries(tasks.named('jar').get().archiveFile.get().asFile)
        def bundleEntries = entries(tasks.named('shadowJar').get().archiveFile.get().asFile)
        def forbiddenPrefixes = [
                'com/bloxbean/cardano/yano/api/',
                'com/bloxbean/cardano/yaci/',
                'com/bloxbean/cardano/client/',
                'co/nstant/in/cbor/',
                'com/bloxbean/cardano/julc/',
                'com/bloxbean/cardano/zeroj/'
        ]
        def forbidden = bundleEntries.findAll { entry ->
            forbiddenPrefixes.any { prefix -> entry.startsWith(prefix) }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    'EUTxO bridge bundle embeds host, Cardano, Julc, or ZeroJ classes: '
                            + forbidden.toList().sort().take(10))
        }
        def contractClass =
                'com/bloxbean/cardano/yano/appchain/eutxo/contracts/EutxoDepositClaim.class'
        def providerClass =
                'com/bloxbean/cardano/yano/appchain/eutxo/bridge/cardano/CardanoBridgeObserverProvider.class'
        if (thinEntries.contains(contractClass) || !bundleEntries.contains(contractClass)
                || !thinEntries.contains(providerClass) || !bundleEntries.contains(providerClass)) {
            throw new GradleException('EUTxO bridge thin/bundle class boundary is incomplete')
        }
    }
}

tasks.register('verifyEutxoBridgeDependencyGraph') {
    group = 'verification'
    description = 'Verifies the federated bridge runtime graph contains no Julc or ZeroJ implementation'

    doLast {
        def forbidden = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
                .collect { component -> component.id.displayName }
                .findAll { identity ->
                    def lower = identity.toLowerCase(java.util.Locale.ROOT)
                    lower.contains('julc') || lower.contains('zeroj')
                }
        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    "EUTxO bridge runtime dependency boundary is violated: ${forbidden.sort()}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyEutxoBridgeArtifactBoundaries'),
            tasks.named('verifyEutxoBridgeDependencyGraph')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(tasks.named('shadowJar')) {
                classifier = 'bundle'
            }
            pom {
                name = 'Yano EUTxO Cardano Bridge'
                description = 'Optional exact Cardano deposit observer and federated bridge services'
            }
        }
    }
}
