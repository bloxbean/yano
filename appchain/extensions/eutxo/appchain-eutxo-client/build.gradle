dependencies {
    api project(':appchain-eutxo-contracts')
    api project(':appchain-client')
    implementation libs.cardano.client.core
    implementation libs.cardano.client.crypto
    implementation libs.cbor

    testImplementation project(':appchain-eutxo-testkit')
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano App-Chain EUTxO Client'
                description = 'Typed Java client facade for the optional Yano EUTxO state machine'
            }
        }
    }
}
