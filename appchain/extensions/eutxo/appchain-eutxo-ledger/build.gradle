plugins {
    id 'com.gradleup.shadow'
}

dependencies {
    compileOnly project(':core-api')
    implementation(project(':appchain-eutxo-contracts')) {
        transitive = false
    }
    compileOnly libs.cardano.client.core
    compileOnly libs.cardano.client.crypto
    compileOnly libs.scalus.bloxbean.ccl
    compileOnly libs.scalus.cardano.ledger
    compileOnly libs.scala3.library
    compileOnly libs.cbor

    testImplementation project(':core-api')
    testImplementation project(':runtime')
    testImplementation project(':appchain-eutxo-testkit')
    testImplementation libs.cardano.client.core
    testImplementation libs.cardano.client.crypto
    testImplementation libs.scalus.bloxbean.ccl
    testImplementation libs.scalus.cardano.ledger
    testImplementation libs.scala3.library
    testImplementation libs.cbor
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.named('shadowJar') {
    archiveBaseName.set("yano-${project.name}")
    archiveClassifier.set('bundle')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    mergeServiceFiles()
    exclude 'com/bloxbean/cardano/yano/api/**'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}

tasks.register('verifyEutxoLedgerArtifactBoundaries') {
    group = 'verification'
    description = 'Verifies the optional EUTxO bundle embeds no host, Cardano, bridge, or ZK classes'
    dependsOn tasks.named('jar'), tasks.named('shadowJar')
    inputs.files(tasks.named('jar').flatMap { it.archiveFile },
            tasks.named('shadowJar').flatMap { it.archiveFile })

    doLast {
        def entries = { File archive ->
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().collect { entry -> entry.name }.toSet()
            }
        }
        def thinEntries = entries(tasks.named('jar').get().archiveFile.get().asFile)
        def bundleEntries = entries(tasks.named('shadowJar').get().archiveFile.get().asFile)
        def forbiddenPrefixes = [
                'com/bloxbean/cardano/yano/api/',
                'com/bloxbean/cardano/yaci/',
                'com/bloxbean/cardano/client/',
                'co/nstant/in/cbor/',
                'com/bloxbean/cardano/zeroj/',
                'com/bloxbean/cardano/julc/'
        ]
        def forbidden = bundleEntries.findAll { entry ->
            forbiddenPrefixes.any { prefix -> entry.startsWith(prefix) }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    'EUTxO ledger bundle embeds host, Cardano, bridge, or ZK classes: '
                            + forbidden.toList().sort().take(10))
        }
        def contractClass =
                'com/bloxbean/cardano/yano/appchain/eutxo/contracts/EutxoRecord.class'
        def providerClass =
                'com/bloxbean/cardano/yano/appchain/eutxo/ledger/EutxoStateMachineProvider.class'
        if (thinEntries.contains(contractClass) || !bundleEntries.contains(contractClass)
                || !thinEntries.contains(providerClass) || !bundleEntries.contains(providerClass)) {
            throw new GradleException('EUTxO thin/bundle class boundary is incomplete')
        }
    }
}

tasks.register('verifyEutxoVirtualLedgerDependencyGraph') {
    group = 'verification'
    description = 'Verifies the virtual-ledger modules do not acquire bridge, custody, ZeroJ, or Julc dependencies'

    doLast {
        def moduleProjects = [
                project(':appchain-eutxo-contracts'),
                project(':appchain-eutxo-ledger'),
                project(':appchain-eutxo-client'),
                project(':appchain-eutxo-testkit')
        ]
        def forbiddenFragments = [
                'zeroj',
                'julc',
                'appchain-eutxo-bridge',
                'cardano-federated',
                'custody'
        ]
        def violations = []
        moduleProjects.each { moduleProject ->
            def components = moduleProject.configurations.runtimeClasspath.incoming
                    .resolutionResult.allComponents
            components.each { component ->
                def identity = component.id.displayName.toLowerCase(java.util.Locale.ROOT)
                if (forbiddenFragments.any { fragment -> identity.contains(fragment) }) {
                    violations.add("${moduleProject.path} -> ${component.id.displayName}")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "EUTxO virtual-ledger dependency boundary is violated: ${violations.sort()}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyEutxoLedgerArtifactBoundaries'),
            tasks.named('verifyEutxoVirtualLedgerDependencyGraph')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(tasks.named('shadowJar')) {
                classifier = 'bundle'
            }
            pom {
                name = 'Yano App-Chain EUTxO Ledger'
                description = 'Optional deterministic Cardano-shaped EUTxO state-machine plugin for Yano'
            }
        }
    }
}
