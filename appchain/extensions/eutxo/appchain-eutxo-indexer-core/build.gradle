plugins {
    id 'java-test-fixtures'
    id 'com.gradleup.shadow'
}

dependencies {
    api project(':core-api')
    api project(':appchain-eutxo-contracts')
    implementation libs.cardano.client.core

    testFixturesApi project(':appchain-eutxo-contracts')
    testFixturesApi libs.junit.jupiter.api
    testFixturesApi libs.assertj.core

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.named('shadowJar') {
    archiveBaseName.set("yano-${project.name}")
    archiveClassifier.set('bundle')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    mergeServiceFiles()
    exclude 'com/bloxbean/cardano/yano/api/**'
    exclude 'com/bloxbean/cardano/yano/appchain/eutxo/contracts/**'
    exclude 'com/bloxbean/cardano/yaci/**'
    exclude 'com/bloxbean/cardano/client/**'
    exclude 'co/nstant/in/cbor/**'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA',
            'module-info.class'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            suppressPomMetadataWarningsFor('testFixturesApiElements')
            suppressPomMetadataWarningsFor('testFixturesRuntimeElements')
            pom {
                name = 'Yano App-Chain EUTxO Indexer Core'
                description = 'Storage-neutral projection and query contracts for the EUTxO lifecycle index'
            }
        }
    }
}
