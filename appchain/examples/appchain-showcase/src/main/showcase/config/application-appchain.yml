# yaml-language-server: $schema=./schema/appchain-runtime.schema.json
# Curated light showcase. Membership, signing keys, peers, proposer, threshold,
# and the optional workflow-chain anchor are injected by appchain-cluster.
yaci:
  plugins:
    # Validator plugins are trusted consensus code. Listing the reference
    # bundle explicitly is required before authenticated-map can resolve it.
    allow-list:
      - com.bloxbean.cardano.yano.appchain.stdlib
      - com.bloxbean.cardano.yano.appchain.authenticated-map-validators
      - com.bloxbean.cardano.yano.appchain.role-workflow
      - com.bloxbean.cardano.yano.appchain.eutxo
      # ADR-UTXO-009: L1 vault-deposit + BATCH withdrawal-confirmation
      # observers and the eutxo-settlement effect executor for
      # payment-chain-settlement, plus the lifecycle-index domain routes
      # used by the eutxo console explorer and the settlement tooling.
      - com.bloxbean.cardano.yano.appchain.eutxo.bridge.cardano
      - com.bloxbean.cardano.yano.appchain.eutxo.indexer
      - com.bloxbean.cardano.yano.appchain.showcase

yano:
  app-chain:
    chains[0]:
      chain-id: "orders-chain"
      state-machine: ordered-log
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: c2b9c92a865dfa7c218a1a6e49f1dd88163372e40466009876458c01609d0d70
      membership:
        mode: governed
      block:
        interval-ms: 1000

    chains[1]:
      chain-id: "registry-chain"
      state-machine: kv-registry
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: cd4f0bac8a0d8c7fd5700510eae8c69256172814b219e9e3b1a914fc89c358b3
      membership:
        mode: governed
      block:
        interval-ms: 1000
      machines:
        kv-registry:
          value-format: utf8

    chains[2]:
      chain-id: "approvals-chain"
      state-machine: approvals
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: 63281a4424bed827004e10185a663bce10de4228953d3959e2ed20aa3a4a9f0b
      membership:
        mode: governed
      block:
        interval-ms: 1000

    chains[3]:
      chain-id: "balances-chain"
      state-machine: balances
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: cf15ea567aa815de08aeba9e20799a71c8c1629ab692cce2812dfa763e5ad116
      membership:
        mode: governed
      block:
        interval-ms: 1000

    chains[4]:
      chain-id: "documents-chain"
      state-machine: doc-trail
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: 653ed9c753b919420ce200de0957a072bdf02e270fd1a5dc09a67dea344e5390
      membership:
        mode: governed
      block:
        interval-ms: 1000

    chains[5]:
      chain-id: "workflow-chain"
      state-machine: showcase-composite
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: 0384867b7ec051bc614ffb4f28bbb8931864cad4f24487ed90c33c259bf57794
      membership:
        mode: governed
      block:
        interval-ms: 1000
        max-messages: 1000
      effects:
        enabled: true
        default-gate: app-final
        max-per-block: 2
        max-payload-bytes: 65536
        result-window-blocks: 1000
        max-expiry-blocks: 1000
        executor:
          enabled: true
          tick-ms: 250
        executors:
          showcase-outbox:
            enabled: false
      machines:
        composite:
          preset: order-approval-outbox-v1

    chains[6]:
      chain-id: "roles-chain"
      state-machine: role-approvals
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: 2a3636f52dac2ea66fbda83ba0c3690f9e7cb9685dacf4caab63a39032877a09
      membership:
        mode: governed
      block:
        interval-ms: 1000

    # Experimental, no-real-funds virtual ledger. The richer ledger, bridge,
    # and ZK flows are delegated to the dedicated `eutxo` showcase profile.
    chains[7]:
      chain-id: "payments-chain"
      state-machine: eutxo-ledger
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: 6b65c806708ba062f207aab15f98fee9bed631ce9c8c4d2f2bd83189a210f7d6
      membership:
        mode: governed
      block:
        interval-ms: 1000
      machines:
        eutxo:
          profile: yano-eutxo-v1
          expected-profile-digest: 2499d01ee7cb0d09d0d498040c6351accd9da83df31666cd4463d0b1722d1212
          genesis:
            # Public deterministic demo key; virtual funds only, never fund on L1.
            address: addr_test1vrld3msldls64ax7c06vu85nvhk70260q970cssxzjh0hlchc79qg
            lovelace: 100000000

    # Genesis and state-commitment identity settings are generated by
    # showcase.sh from the exact bootstrap membership and release catalog.
    chains[8]:
      chain-id: "authenticated-map-chain"
      state-machine: authenticated-map
      membership:
        mode: governed
      block:
        interval-ms: 1000

    # Contrast chain: classic-JMT commitment backend with a basic
    # (ungoverned) authorization profile. Genesis is generated by showcase.sh.
    chains[9]:
      chain-id: "authenticated-map-jmt-chain"
      state-machine: authenticated-map
      membership:
        mode: governed
      block:
        interval-ms: 1000

    # ADR-UTXO-009: the L1 custody boundary demo, on the hardened SCRIPT
    # vault. Deposits into the vault mirror into this chain through
    # stability-gated L1 observation; withdrawal claims are settled back out
    # by the FEDERATION — the node emits an l1.settlement effect, members
    # co-sign over ~bridge/settlement/*, and the batch lands on L1 without
    # any operator command. Custody is the threshold + the nullifier shards,
    # not a single key (that was the retired v2 bridge chain).
    #
    # The addresses below are a pure function of the deterministic devnet
    # bootstrap (ShowcaseSettlementPlan); regenerate this block with:
    #   ./gradlew :appchain-eutxo-demo:test --tests '*EmitShowcaseYamlTest'
    # The parameterized validators are written to config/settlement/ by
    # ./showcase.sh settlement bootstrap. PUBLIC demo keys; demo amounts only.
    # DEVNET-ONLY profile (relaxed fallback floor) — never for real funds.
    chains[10]:
      chain-id: "payment-chain-settlement"
      state-machine: "eutxo-ledger"
      membership:
        mode: "governed"
      block:
        interval-ms: "1000"
      l1:
        stability-depth: "2"
      state:
        commitment-profile: "mpf-blake2b256-v1"
        format-fingerprint: "91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b"
        genesis-id: "efa0112f8a2b755521b2d16489835a8f38afe90b01c3ce2db749e8c899e6e560"
      machines:
        eutxo:
          profile: "yano-eutxo-v3-bridge-settlement-devnet"
          expected-profile-digest: "12880861e62bf4cb750a6bbfdd818c2ba2370a1d2cc0952fcba16c4e6da38e3a"
          network: "devnet"
          bridge:
            params:
              fallback-delay-slots: "60"
              soft-batch-cap: "1"
            observer-id: "bridge-deposits"
            vault-address: "addr_test1wpwhmf5cd5pm9gsg5y8xnkyk3xue2u35ral098gd8u49g3gjpdqgr"
            vault-script-hash: "5d7da6986d03b2a208a10e69d89689b99572341f7ef29d0d3f2a5445"
            confirmation-observer-id: "bridge-withdrawals"
            withdrawal-address: "addr_test1vrf4896s3htkc8pzytgvvm07c2e489rtcg42f23zk5r2mjs8ge5ef"
            epoch: "0"
            max-withdrawal-lovelace: "50000000"
            max-pending-withdrawals: "100"
            withdrawals-paused: "false"
      observers:
        bridge-deposits:
          type: "eutxo-vault-deposit-v1"
          chain-id: "payment-chain-settlement"
          vault-address: "addr_test1wpwhmf5cd5pm9gsg5y8xnkyk3xue2u35ral098gd8u49g3gjpdqgr"
          vault-script-hash: "5d7da6986d03b2a208a10e69d89689b99572341f7ef29d0d3f2a5445"
          max-lovelace: "100000000"
        bridge-withdrawals:
          type: "eutxo-batch-withdrawal-confirmation-v1"
          chain-id: "payment-chain-settlement"
          bridge-epoch: "0"
          vault-address: "addr_test1wpwhmf5cd5pm9gsg5y8xnkyk3xue2u35ral098gd8u49g3gjpdqgr"
      effects:
        enabled: "true"
        executor:
          enabled: "true"
        executors:
          eutxo-settlement:
            owner: "false"
            vault-address: "addr_test1wpwhmf5cd5pm9gsg5y8xnkyk3xue2u35ral098gd8u49g3gjpdqgr"
            shard-address: "addr_test1wqkrdxsvwfrzwm60qf6fk06w6f3me8ssfwururl4mt3j94sjytqyh"
            root-address: "addr_test1wqrd9g5sauf0qr32qh4xptfs5sjnuq89skca6tn3kgf6pkcyfxw0z"
            root-unit: "57f1b65a38d0bfc2ce88071973137972eaa365e89bb43ef857982c0659616e6f536574746c65526f6f74"
            shard-thread-policy-id: "f31a3e218309d7a8b055150d55ef930a96c096072ad8ce31e758edec"
            operator-address: "addr_test1vq2p8rmdp8p70auqjg0vzu59793575jqegfuwejrk5mu42czwm8wp"
            operator-seed: "9166d2a27e522e201ff90f5f24d9d18f5f0a7999886c006e0d2653946c40af79"
            vault-script-file: "${yano.home}/config/settlement/settlement-vault.script"
            shard-script-file: "${yano.home}/config/settlement/settlement-shard.script"
            round-timeout-ms: "15000"
