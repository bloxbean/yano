# yaml-language-server: $schema=./schema/appchain-runtime.schema.json
# Curated light showcase. Membership, signing keys, peers, proposer, threshold,
# and the optional workflow-chain anchor are injected by appchain-cluster.
yaci:
  plugins:
    # Validator plugins are trusted consensus code. Listing the reference
    # bundle explicitly is required before authenticated-map can resolve it.
    allow-list:
      - com.bloxbean.cardano.yano.appchain.stdlib
      - com.bloxbean.cardano.yano.appchain.authenticated-map-validators
      - com.bloxbean.cardano.yano.appchain.role-workflow
      - com.bloxbean.cardano.yano.appchain.eutxo
      # ADR-UTXO-008: L1 vault-deposit + withdrawal-confirmation observers
      # for payment-chain-l1bridge, and the lifecycle-index domain routes
      # used by the eutxo console explorer and the bridge demo tooling.
      - com.bloxbean.cardano.yano.appchain.eutxo.bridge.cardano
      - com.bloxbean.cardano.yano.appchain.eutxo.indexer
      - com.bloxbean.cardano.yano.appchain.showcase

yano:
  app-chain:
    chains[0]:
      chain-id: "orders-chain"
      state-machine: ordered-log
      membership:
        mode: governed
      block:
        interval-ms: 1000

    chains[1]:
      chain-id: "registry-chain"
      state-machine: kv-registry
      membership:
        mode: governed
      block:
        interval-ms: 1000
      machines:
        kv-registry:
          value-format: utf8

    chains[2]:
      chain-id: "approvals-chain"
      state-machine: approvals
      membership:
        mode: governed
      block:
        interval-ms: 1000

    chains[3]:
      chain-id: "balances-chain"
      state-machine: balances
      membership:
        mode: governed
      block:
        interval-ms: 1000

    chains[4]:
      chain-id: "documents-chain"
      state-machine: doc-trail
      membership:
        mode: governed
      block:
        interval-ms: 1000

    chains[5]:
      chain-id: "workflow-chain"
      state-machine: showcase-composite
      membership:
        mode: governed
      block:
        interval-ms: 1000
        max-messages: 1000
      effects:
        enabled: true
        default-gate: app-final
        max-per-block: 2
        max-payload-bytes: 65536
        result-window-blocks: 1000
        max-expiry-blocks: 1000
        executor:
          enabled: true
          tick-ms: 250
        executors:
          showcase-outbox:
            enabled: false
      machines:
        composite:
          preset: order-approval-outbox-v1

    chains[6]:
      chain-id: "roles-chain"
      state-machine: role-approvals
      membership:
        mode: governed
      block:
        interval-ms: 1000

    # Experimental, no-real-funds virtual ledger. The richer ledger, bridge,
    # and ZK flows are delegated to the dedicated `eutxo` showcase profile.
    chains[7]:
      chain-id: "payments-chain"
      state-machine: eutxo-ledger
      membership:
        mode: governed
      block:
        interval-ms: 1000
      machines:
        eutxo:
          profile: yano-eutxo-v1
          expected-profile-digest: 2499d01ee7cb0d09d0d498040c6351accd9da83df31666cd4463d0b1722d1212
          genesis:
            # Public deterministic demo key; virtual funds only, never fund on L1.
            address: addr_test1vrld3msldls64ax7c06vu85nvhk70260q970cssxzjh0hlchc79qg
            lovelace: 100000000

    # Genesis and state-commitment identity settings are generated by
    # showcase.sh from the exact bootstrap membership and release catalog.
    chains[8]:
      chain-id: "authenticated-map-chain"
      state-machine: authenticated-map
      membership:
        mode: governed
      block:
        interval-ms: 1000

    # Contrast chain: classic-JMT commitment backend with a basic
    # (ungoverned) authorization profile. Genesis is generated by showcase.sh.
    chains[9]:
      chain-id: "authenticated-map-jmt-chain"
      state-machine: authenticated-map
      membership:
        mode: governed
      block:
        interval-ms: 1000

    # ADR-UTXO-008: L1 custody boundary demo. Deposits into the vault script
    # mirror into this chain through stability-gated L1 observation, and
    # withdrawal claims settle back out to the fixed payout address. The
    # vault operator and payout identities are PUBLIC deterministic demo
    # keys (seed = sha256("yano-showcase-demo-actor:bridge-operator") and
    # ...":bridge-payout") — the operator key IS custody. Demo amounts only;
    # no virtual genesis: every L2 fund enters via an L1 deposit.
    chains[10]:
      chain-id: "payment-chain-l1bridge"
      state-machine: eutxo-ledger
      membership:
        mode: governed
      block:
        interval-ms: 1000
      l1:
        stability-depth: 2
      machines:
        eutxo:
          profile: yano-eutxo-v2-plutus-v3
          expected-profile-digest: 8cd4adb72def2c31dc8551a02f67429ea468bb2024dbe85a1dc7300590c9d1bf
          bridge:
            observer-id: bridge-deposits
            vault-address: addr_test1wpxg9ntn83pztkpw09lfkvv4uurd7pxztlx7yg0zqr0frdcuc9zzj
            vault-script-hash: 4c82cd733c4225d82e797e9b3195e706df04c25fcde221e200de91b7
            confirmation-observer-id: bridge-withdrawals
            withdrawal-address: addr_test1vrpz48l78va55y3ewuv7p6narrtgsw2ajq3ns9xx945e0vsmpxjls
            epoch: 1
            max-withdrawal-lovelace: 50000000
            max-pending-withdrawals: 100
            withdrawals-paused: false
      observers:
        bridge-deposits:
          type: eutxo-vault-deposit-v1
          chain-id: payment-chain-l1bridge
          vault-address: addr_test1wpxg9ntn83pztkpw09lfkvv4uurd7pxztlx7yg0zqr0frdcuc9zzj
          vault-script-hash: 4c82cd733c4225d82e797e9b3195e706df04c25fcde221e200de91b7
          max-lovelace: 100000000
        bridge-withdrawals:
          type: eutxo-withdrawal-confirmation-v1
          chain-id: payment-chain-l1bridge
          bridge-epoch: 1
          vault-address: addr_test1wpxg9ntn83pztkpw09lfkvv4uurd7pxztlx7yg0zqr0frdcuc9zzj
