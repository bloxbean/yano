ext.runtimePluginBundleId =
        'com.bloxbean.cardano.yano.appchain.authenticated-map-validators'
ext.runtimePluginExcludedBundleIds = []
apply from: rootProject.file('gradle/runtime-plugin-bundle.gradle')

dependencies {
    compileOnly(project(':core-api')) {
        transitive = false
    }
    implementation project(':appchain-stdlib-contracts')

    testImplementation(project(':core-api')) {
        transitive = false
    }
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano Authenticated-Map Validators'
                description = 'Trusted first-party authenticated-map validator plugin bundle'
            }
        }
    }
}
