dependencies {
    implementation libs.cbor
    implementation libs.cardano.client.crypto

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
    testImplementation project(':core-api')
    testImplementation libs.cardano.client.mpf
    testImplementation libs.cardano.client.jmt
}

tasks.register('printAuthenticatedMapGoldenVectors', JavaExec) {
    group = 'verification'
    description = 'Prints deterministic ADR-025 Phase 0 golden vectors for review/update'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bloxbean.cardano.yano.appchain.stdlib.contracts.AuthenticatedMapGoldenVectorGenerator'
}

tasks.register('verifyAuthenticatedMapGoldenVectors', Exec) {
    group = 'verification'
    description = 'Verifies ADR-025 vectors with an independent Python implementation'
    commandLine 'python3',
            file('scripts/verify-authenticated-map-vectors.py'),
            file('src/main/resources/META-INF/yano/contracts/authenticated-map/v1/golden-vectors.properties')
}

tasks.register('benchmarkAuthenticatedMapContracts', JavaExec) {
    group = 'verification'
    description = 'Runs the comparable ADR-025 MPF/classic-JMT contract baseline benchmark'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bloxbean.cardano.yano.appchain.stdlib.contracts.StateCommitmentBaselineBenchmark'
    def report = layout.buildDirectory.file('reports/adr025/phase0-baseline.json')
    args report.get().asFile.absolutePath,
            providers.gradleProperty('adr025BenchmarkKeys').getOrElse('100000'),
            providers.gradleProperty('adr025BenchmarkBatch').getOrElse('100')
    outputs.file(report)
}

tasks.register('verifyAdr025DependencyBaseline') {
    group = 'verification'
    description = 'Fails unless ADR-025 contract/proof tests resolve the pinned CCL development baseline'
    doLast {
        def expected = libs.versions.cardano.client.lib.get()
        def required = [
                'cardano-client-merkle-patricia-forestry',
                'cardano-client-jellyfish-merkle',
                'cardano-client-crypto'
        ] as Set
        def resolved = configurations.testRuntimeClasspath.incoming.resolutionResult.allComponents
                .findAll { component ->
                    component.id instanceof
                            org.gradle.api.artifacts.component.ModuleComponentIdentifier
                            && component.id.group == 'com.bloxbean.cardano'
                            && component.id.module in required
                }.collectEntries { component ->
                    def id = component.id as
                            org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    [(id.module): id.version]
                }
        def missing = required - resolved.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException("ADR-025 CCL baseline is missing modules: ${missing.sort()}")
        }
        def wrong = resolved.findAll { module, version -> version != expected }
        if (!wrong.isEmpty()) {
            throw new GradleException(
                    "ADR-025 requires CCL ${expected}; resolved incompatible modules ${wrong}")
        }
        logger.lifecycle('ADR-025 CCL dependency baseline verified: {}', resolved.toSorted())
    }
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.register('verifyStdlibContractArtifact') {
    dependsOn tasks.named('jar')
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { jar ->
            if (jar.entries().any { entry ->
                entry.name.startsWith('META-INF/services/')
                        || entry.name.startsWith('META-INF/yano/plugins/')
                        || entry.name.contains('/AppStateMachine')
            }) {
                throw new GradleException(
                        'Stdlib contracts must not contain plugin manifests, services, or SPI types')
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyStdlibContractArtifact')
    dependsOn tasks.named('verifyAuthenticatedMapGoldenVectors')
    dependsOn tasks.named('verifyAdr025DependencyBaseline')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano App-Chain Standard Library Contracts'
                description = 'Bounded versioned wire and state contracts for stock app-chain state machines'
            }
        }
    }
}
