plugins {
    id 'java-library'
}

description = 'Implementation-neutral portable and on-chain app-chain proof contracts'

dependencies {
    implementation libs.cardano.client.crypto

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano App-Chain Proof Contracts'
                description = 'Bounded implementation-neutral MPF proof ABI and contracts'
            }
        }
    }
}
