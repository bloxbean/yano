plugins {
    id 'com.gradleup.shadow'
}

description = 'Optional Cardano History app-chain product plugin'

dependencies {
    compileOnly project(':core-api')
    compileOnly project(':appchain-composite')
    compileOnly project(':appchain-composite-contracts')
    compileOnly project(':appchain-stdlib')
    compileOnly project(':appchain-stdlib-contracts')

    testImplementation project(':core-api')
    testImplementation project(':appchain-composite')
    testImplementation project(':appchain-composite-contracts')
    testImplementation project(':appchain-stdlib')
    testImplementation project(':appchain-stdlib-contracts')
    testImplementation project(':appchain-testkit')
    testImplementation libs.assertj.core
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

tasks.named('processResources') {
    filesMatching('META-INF/yano/plugins/*.json') {
        expand(productVersion: project.version.toString())
    }
}

tasks.named('shadowJar') {
    archiveBaseName.set('yano-appchain-cardano-history')
    archiveClassifier.set('bundle')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    mergeServiceFiles()
    exclude 'com/bloxbean/cardano/yano/api/**'
    exclude 'com/bloxbean/cardano/yano/appchain/composite/**'
    exclude 'com/bloxbean/cardano/yano/appchain/stdlib/**'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}

tasks.register('verifyBundleBoundary') {
    dependsOn tasks.named('shadowJar')
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
    doLast {
        def forbidden = ['com/bloxbean/cardano/yano/api/',
                         'com/bloxbean/cardano/yano/appchain/composite/',
                         'com/bloxbean/cardano/yano/appchain/stdlib/']
        def entries = zipTree(tasks.named('shadowJar').get().archiveFile.get().asFile)
                .matching { include '**/*.class' }.files
        def bad = entries.findAll { file -> forbidden.any { file.path.replace('\\', '/').contains(it) } }
        if (!bad.isEmpty()) throw new GradleException("Cardano History bundle contains host classes: ${bad}")
    }
}

tasks.named('check') { dependsOn tasks.named('verifyBundleBoundary') }
