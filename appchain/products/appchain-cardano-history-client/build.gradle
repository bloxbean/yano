dependencies {
    api project(':appchain-client')
    api project(':appchain-stdlib-contracts')
    implementation libs.jackson.databind

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
    testImplementation libs.jackson.dataformat.cbor
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

tasks.named('compileJava') {
    options.compilerArgs.removeAll { it.startsWith('-Aproject=') }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano Cardano History Client'
                description = 'Typed root-fixed queries and standalone Cardano History proof verification'
            }
        }
    }
}
