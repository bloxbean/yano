pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'yano'

// Yano owns the Cardano data node, the app-chain host framework, OrderedLog,
// and the retained plugin/test contracts. JVM extensions are built in yano-x.
def yanoModules = [
        'core-api'                    : 'core-api',
        'plugin-catalog'              : 'plugin-catalog',
        'consensus'                   : 'consensus',
        'p2p'                         : 'p2p',
        'runtime'                     : 'runtime',
        'devnet-toolkit'              : 'devnet-toolkit',
        'testkit'                     : 'testkit',
        'testkit-ccl'                 : 'testkit-ccl',
        'tx-services'                 : 'tx-services',
        'bootstrap-providers'         : 'bootstrap-providers',
        'app'                         : 'app',
        'app-e2e-testkit'             : 'app-e2e-testkit',
        'ledger-rules'                : 'ledger-rules',
        'ledger-state'                : 'ledger-state',
        'ccl-ledger-rules'            : 'ccl-ledger-rules',
        'scalus-bridge'               : 'scalus-bridge',
        'yano-bom'                    : 'bom',
        'appchain-config'             : 'appchain/appchain-config',
        'console-ui'                  : 'console-ui',
        'appchain-testkit'            : 'appchain/appchain-testkit',
        'appchain-proof-verifier'     : 'appchain/appchain-proof-verifier',
        'appchain-anchor-onchain'     : 'appchain/onchain/appchain-anchor-onchain',
        'appchain-plugin-conformance' : 'appchain/fixtures/appchain-plugin-conformance'
]

yanoModules.each { projectName, projectDirectory ->
    include projectName
    project(":${projectName}").projectDir = file(projectDirectory)
}

include ':archive-modules:archive-api'
include ':archive-modules:archive-core'
include ':archive-modules:archive-store-ducklake'
include ':archive-modules:archive-store-sqlite'

gradle.settingsEvaluated {
    logger.lifecycle('Yano build configured with {} projects', yanoModules.size() + 4)
}
