def leanValue = gradle.startParameter.projectProperties
        .getOrDefault('leanYanoBuild', 'false')
if (!(leanValue in ['true', 'false'])) {
    throw new GradleException('leanYanoBuild must be true or false')
}
def leanYanoBuild = Boolean.parseBoolean(leanValue)

def selectedModules = new LinkedHashMap(yanoModules)
if (!leanYanoBuild) {
    selectedModules.putAll(yanoXModules)
}

selectedModules.each { projectName, projectDirectory ->
    include projectName
    project(":${projectName}").projectDir = file(projectDirectory)
}

gradle.settingsEvaluated {
    logger.lifecycle('Yano {} build configured with {} projects',
            leanYanoBuild ? 'lean' : 'full', selectedModules.size())
}
