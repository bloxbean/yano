import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'yano'

def leanValue = gradle.startParameter.projectProperties
        .getOrDefault('leanYanoBuild', 'false')
if (!(leanValue in ['true', 'false'])) {
    throw new GradleException('leanYanoBuild must be true or false')
}
def leanYanoBuild = Boolean.parseBoolean(leanValue)
def allocationFile = file('config/repository-split/allocation-v1.json')
def allocation = new JsonSlurper().parse(allocationFile)
def retainedDispositions = ['retain', 'temporary-retain'] as Set
def selectedModules = allocation.modules.findAll { module ->
    !leanYanoBuild || retainedDispositions.contains(module.disposition)
}

selectedModules.each { module ->
    String projectPath = module.sourcePath.toString()
    if (!projectPath.startsWith(':') || projectPath.count(':') != 1) {
        throw new GradleException(
                "ADR-030 source project paths must remain flat during extraction: ${projectPath}")
    }
    include projectPath.substring(1)
    project(projectPath).projectDir = file(module.sourceDirectory.toString())
}

gradle.settingsEvaluated {
    logger.lifecycle('ADR-030 {} build configured with {} projects',
            leanYanoBuild ? 'lean Yano' : 'monorepo', selectedModules.size())
}
