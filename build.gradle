def commit_id=getCheckedOutGitCommitHash()
if (commit_id && project.version.endsWith("-SNAPSHOT")) {
    version = "${project.version}".replace("-SNAPSHOT", "-${commit_id}-SNAPSHOT")
}

def nonLibraryModules = ['app', 'console-ui', 'yano-bom', 'archive-modules'] as Set

subprojects {
    // Skip most configuration for application modules (Quarkus/Scala handle their own builds)
    if (!(project.name in nonLibraryModules)) {
        apply plugin: 'java-library'
        apply plugin: 'maven-publish'
        apply plugin: 'signing'
        apply plugin: 'org.unbroken-dome.test-sets'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url "https://central.sonatype.com/repository/maven-snapshots/"
        }
    }

    // def commit_id=getCheckedOutGitCommitHash()
    if (commit_id && project.version.endsWith("-SNAPSHOT")) {
        version = "${project.version}".replace("-SNAPSHOT", "-${commit_id}-SNAPSHOT")
    }

    // Only configure library-specific settings for non-application modules
    if (!(project.name in nonLibraryModules)) {
        def allocatedArtifactId = 'yano-' + project.name
        tasks.named('jar') {
            archiveBaseName = allocatedArtifactId
        }
        dependencies {
            api libs.slf4j.api

            compileOnly libs.lombok
            annotationProcessor libs.lombok

            testImplementation libs.junit.jupiter.api
            testRuntimeOnly libs.junit.jupiter.engine
            testRuntimeOnly libs.junit.platform.launcher
            testImplementation libs.harmcrest.library
            testImplementation libs.mockito.inline
            testImplementation libs.mockito.junit.jupiter
            testImplementation libs.assertj.core
            testRuntimeOnly libs.slf4j.reload4j

            testCompileOnly libs.lombok
            testAnnotationProcessor libs.lombok
        }

        compileJava {
            sourceCompatibility = '25'
            targetCompatibility = '25'

            options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
        }

        tasks.withType(Javadoc) {
            options.encoding = 'UTF-8'
        }

        task sourceJar(type: Jar) {
            archiveClassifier = "sources"
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            from sourceSets.main.allJava
        }

        task javadocJar(type: Jar, dependsOn: javadoc) {
            archiveClassifier = "javadoc"
            from javadoc.destinationDir
        }

        testSets {
            integrationTest
            cryptoTest
            distributionTest
        }

        tasks.named('cryptoTest') {
            // Groth16 setup/proving tasks use large heaps. Keep these suites
            // serialized even when the rest of the build uses --parallel.
            usesService cryptoTestLock
            maxParallelForks = 1
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                    artifact(sourceJar) {
                        classifier = 'sources'
                    }
                    artifact(javadocJar) {
                        classifier = 'javadoc'
                    }

                    artifactId allocatedArtifactId
                    pom {
                        url = 'https://github.com/bloxbean/yano'
                        licenses {
                            license {
                                name = 'The MIT License'
                                url = 'https://opensource.org/licenses/mit-license.php'
                            }
                        }
                        developers {
                            developer {
                                id = 'satran004'
                                name = 'Satya'
                            }
                        }
                        scm {
                            connection = 'scm:git:git://github.com/bloxbean/yano.git'
                            developerConnection = 'scm:git:ssh://git@github.com/bloxbean/yano.git'
                            url = 'https://github.com/bloxbean/yano'
                        }
                    }
                }
            }
        }

        ext.isReleaseVersion = !version.endsWith("SNAPSHOT")

        if (isReleaseVersion && !project.hasProperty("skipSigning")) {
            signing {
                sign publishing.publications
            }
        }
    }

    // Make all tests use JUnit 5 (for all modules including application)
    tasks.withType(Test) {
        useJUnitPlatform()
        jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'

        // A deadlocked test blocks forever, and a blocked build is indistinguishable from a slow
        // one: an inherited PluginOperationsRegistry deadlock sat in awaitNoActiveSamplesLocked
        // for roughly 21 hours while the suite appeared to be "still running". A per-test
        // deadline turns that into a failure with a stack trace instead of silence.
        //
        // Applied through JUnit's global timeout so it covers every test without annotating each
        // one, and set well above the slowest legitimate test (DuckLake maintenance passes take
        // tens of seconds) so it never fires on a merely slow one.
        systemProperty 'junit.jupiter.execution.timeout.default',
                rootProject.providers.gradleProperty('junitTestTimeout').getOrElse('10m')
        systemProperty 'junit.jupiter.execution.timeout.thread.mode.default', 'SEPARATE_THREAD'

        // Backstop for a worker that hangs outside a test method, which the JUnit timeout cannot
        // interrupt - the Gradle daemon reclaims it rather than waiting indefinitely.
        timeout = Duration.ofMinutes(
                Integer.parseInt(rootProject.providers.gradleProperty('junitTaskTimeoutMinutes')
                        .getOrElse('45')))
        testLogging {
            def verbose = rootProject.providers.gradleProperty('verboseTests')
                    .map { it.toBoolean() }
                    .getOrElse(false)
            events(*(verbose
                    ? ['started', 'passed', 'skipped', 'failed']
                    : ['skipped', 'failed']))
            // Always full. This prints only for a failing test, and the short form gives the
            // exception class and line without its message - which is precisely the part needed
            // to tell a lock conflict from a corrupt file from a missing column family. Gating it
            // behind a flag means the one run that failed is the one run that cannot be
            // diagnosed, and on CI there is no opportunity to re-run it verbosely by hand.
            exceptionFormat 'full'
            showStandardStreams = verbose
        }

    }

    // First-party app-chain manifests are source templates. Their bundle and
    // dependency versions must follow the owning Gradle publication rather
    // than being copied into every JSON file at release time.
    tasks.matching { it.name == 'processResources' }.configureEach {
        def pluginManifestVersion = project.version.toString()
        inputs.property('pluginManifestVersion', pluginManifestVersion)
        filesMatching('META-INF/yano/plugins/*.json') {
            filter { line ->
                line.replace('${pluginVersion}', pluginManifestVersion)
            }
        }
    }
}

// Phase/release rehearsals publish the same Maven publications to an isolated
// repository without changing the normal Maven Local or Sonatype mechanisms.
// A file repository is sufficient locally; CI may provide an HTTP staging URL.
allprojects { candidate ->
    candidate.pluginManager.withPlugin('maven-publish') {
        if (stagingRepository.isPresent()) {
            candidate.publishing.repositories {
                maven {
                    name = 'staging'
                    url = candidate.uri(stagingRepository.get())
                }
            }
        }
    }
}

tasks.register('distributionCheck') {
    group = 'verification'
    description = 'Validates the core JVM distribution and directory-plugin contract.'
    dependsOn ':app:verifyCoreJvmDistribution',
            ':app:packagedJvmPluginCatalogSmoke'
}

tasks.register('extendedTest') {
    group = 'verification'
    description = 'Runs every retained repository integrationTest suite.'
    dependsOn subprojects.findAll { candidate ->
        !(candidate.name in nonLibraryModules) || candidate.name == 'app'
    }.collect { candidate -> "${candidate.path}:integrationTest" }
}

tasks.register('fullBuild') {
    group = 'build'
    description = 'Runs the retained Yano build, integration tests, and JVM distribution checks.'
    dependsOn ':build'
    dependsOn subprojects.collect { candidate -> "${candidate.path}:build" }
    dependsOn tasks.named('extendedTest'), tasks.named('distributionCheck')
}

def getCheckedOutGitCommitHash() {
    try {
        return grgit.head()?.abbreviatedId
    } catch (Exception e) {
        return null
    }
}
