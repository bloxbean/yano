tasks.register('distributionCheck') {
    group = 'verification'
    description = 'Validates copied/extracted Yano, app-chain CLI, and showcase distributions.'
    dependsOn ':app:verifyCoreJvmDistribution',
            ':appchain-devtools:distributionTest',
            ':app:packagedJvmPluginCatalogSmoke',
            ':appchain-showcase:showcaseDistributionContract',
            ':appchain-devtools:finalDistributionRuntimeAcceptance',
            ':appchain-devtools:finalDistributionStockOutcomeAcceptance'
}

tasks.register('extendedTest') {
    group = 'verification'
    description = 'Runs every repository integrationTest suite, including app-chain extensions.'
    dependsOn subprojects.findAll { candidate ->
        !(candidate.name in nonLibraryModules) || candidate.name == 'app'
    }.collect { candidate -> "${candidate.path}:integrationTest" }
}

tasks.register('fullBuild') {
    group = 'build'
    description = 'Runs the default build plus extended, crypto, and distribution verification.'
    dependsOn ':build'
    dependsOn subprojects.collect { candidate -> "${candidate.path}:build" }
    dependsOn tasks.named('extendedTest'),
            tasks.named('appChainCryptoTest'),
            tasks.named('distributionCheck')
}

// Every downstream runtime artifact must have one isolated
// bundle and one real JVM provider-activation test. This inventory is also the
// source for the checked conformance matrix consumed by Yano X.
if (findProject(':appchain-stdlib') != null) {
def runtimePluginBundles = [
        [projectPath: ':appchain-composite',
         bundleId: 'com.bloxbean.cardano.yano.appchain.composite'],
        [projectPath: ':appchain-role-workflow',
         bundleId: 'com.bloxbean.cardano.yano.appchain.role-workflow'],
        [projectPath: ':appchain-stdlib',
         bundleId: 'com.bloxbean.cardano.yano.appchain.stdlib'],
        [projectPath: ':appchain-authenticated-map-validators',
         bundleId: 'com.bloxbean.cardano.yano.appchain.authenticated-map-validators'],
        [projectPath: ':appchain-showcase',
         bundleId: 'com.bloxbean.cardano.yano.appchain.showcase'],
        [projectPath: ':appchain-effects-cardano',
         bundleId: 'com.bloxbean.cardano.yano.appchain.effects.cardano'],
        [projectPath: ':appchain-ipfs',
         bundleId: 'com.bloxbean.cardano.yano.appchain.ipfs'],
        [projectPath: ':appchain-kafka',
         bundleId: 'com.bloxbean.cardano.yano.appchain.kafka'],
        [projectPath: ':appchain-objectstore-s3',
         bundleId: 'com.bloxbean.cardano.yano.appchain.objectstore.s3'],
        [projectPath: ':appchain-zk',
         bundleId: 'com.bloxbean.cardano.yano.appchain.zk'],
        [projectPath: ':appchain-eutxo-zk-indexer',
         bundleId: 'com.bloxbean.cardano.yano.appchain.eutxo.zk.indexer'],
        [projectPath: ':appchain-eutxo-zk-runtime',
         bundleId: 'com.bloxbean.cardano.yano.appchain.eutxo.zk.runtime'],
        [projectPath: ':appchain-eutxo-bridge-cardano',
         bundleId: 'com.bloxbean.cardano.yano.appchain.eutxo.bridge.cardano'],
        [projectPath: ':appchain-eutxo-indexer-jdbc',
         bundleId: 'com.bloxbean.cardano.yano.appchain.eutxo.indexer'],
        [projectPath: ':appchain-eutxo-ledger',
         bundleId: 'com.bloxbean.cardano.yano.appchain.eutxo'],
        [projectPath: ':appchain-cardano-history',
         bundleId: 'com.bloxbean.cardano.yano.appchain.cardano-history'],
        [projectPath: ':appchain-evidence-profile',
         bundleId: 'com.bloxbean.cardano.yano.appchain.evidence-profile'],
        [projectPath: ':appchain-evidence-registry',
         bundleId: 'com.bloxbean.cardano.yano.appchain.evidence-registry']
]

def runtimePluginBundlesById = runtimePluginBundles.collectEntries { specification ->
    [(specification.bundleId): specification]
}

gradle.projectsEvaluated {
    runtimePluginBundles.each { specification ->
        def pluginProject = project(specification.projectPath)
        def allocation = repositoryModuleByPath[specification.projectPath]
        if (allocation == null || allocation.disposition != 'move'
                || allocation.publicationType != 'runtime-plugin') {
            throw new GradleException(
                    "Runtime bundle allocation is invalid for ${specification.projectPath}")
        }
        def shadowJar = pluginProject.tasks.named('shadowJar')
        pluginProject.components.java.withVariantsFromConfiguration(
                pluginProject.configurations.shadowRuntimeElements) {
            skip()
        }
        def mainPublication = pluginProject.publishing.publications
                .findByName('mavenJava') as MavenPublication
        if (mainPublication == null) {
            throw new GradleException(
                    "Runtime plugin ${specification.projectPath} has no thin publication")
        }
        mainPublication.artifacts.findAll { artifact ->
            artifact.classifier == 'bundle'
        }.each { artifact -> mainPublication.artifacts.remove(artifact) }

        def bundlePublication = pluginProject.publishing.publications
                .create('pluginBundle', MavenPublication) {
            artifactId = allocation.artifactId.toString() + '-bundle'
            artifact(shadowJar) {
                classifier = null
            }
            pom {
                name = "${allocation.artifactId} deployable plugin bundle"
                description = "Dependency-complete Yano X bundle for ${specification.bundleId}"
                url = 'https://github.com/bloxbean/yano-x'
                licenses {
                    license {
                        name = 'The MIT License'
                        url = 'https://opensource.org/licenses/mit-license.php'
                    }
                }
                developers {
                    developer {
                        id = 'satran004'
                        name = 'Satya'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/bloxbean/yano-x.git'
                    developerConnection = 'scm:git:ssh://git@github.com/bloxbean/yano-x.git'
                    url = 'https://github.com/bloxbean/yano-x'
                }
            }
        }
        if (!pluginProject.version.toString().endsWith('SNAPSHOT')
                && !pluginProject.hasProperty('skipSigning')) {
            pluginProject.signing.sign(bundlePublication)
        }
    }
}

def sourceManifestFor = { specification ->
    def manifests = project(specification.projectPath).fileTree(
            'src/main/resources/META-INF/yano/plugins') { include '*.json' }.files
    if (manifests.size() != 1) {
        throw new GradleException(
                "${specification.projectPath} must own exactly one source manifest")
    }
    [file: manifests.first(), value: new groovy.json.JsonSlurper().parse(manifests.first())]
}
def runtimeBundleClosure = { rootSpecification ->
    def result = new LinkedHashMap<String, Object>()
    Closure visit
    visit = { specification ->
        if (result.containsKey(specification.bundleId)) return
        def parsed = sourceManifestFor(specification).value
        (parsed.dependencies ?: []).each { dependency ->
            def dependencySpecification = runtimePluginBundlesById[dependency.id]
            if (dependencySpecification == null) {
                throw new GradleException(
                        "${specification.bundleId} depends on unregistered runtime bundle ${dependency.id}")
            }
            visit(dependencySpecification)
        }
        result[specification.bundleId] = specification
    }
    visit(rootSpecification)
    result.values().toList()
}

def activationTasks = runtimePluginBundles.collect { specification ->
    def pluginProject = project(specification.projectPath)
    def closureSpecifications = runtimeBundleClosure(specification)
    def suffix = pluginProject.name.split('-').collect { token -> token.capitalize() }.join('')
    tasks.register("activate${suffix}RuntimePluginBundle", Test) {
        group = 'verification'
        description = "Activates every provider in ${specification.bundleId} from its isolated JVM bundle closure"
        dependsOn closureSpecifications.collect { "${it.projectPath}:shadowJar" }
        dependsOn ':runtime:testClasses'
        testClassesDirs = project(':runtime').sourceSets.test.output.classesDirs
        classpath = project(':runtime').sourceSets.test.runtimeClasspath
        filter {
            includeTestsMatching(
                    'com.bloxbean.cardano.yano.runtime.plugins.RuntimePluginBundleActivationTest')
        }
        doFirst {
            def bundleFiles = closureSpecifications.collect { member ->
                project(member.projectPath).tasks.named('shadowJar').get()
                        .archiveFile.get().asFile.absolutePath
            }
            systemProperty 'yano.bundle.paths', bundleFiles.join(File.pathSeparator)
            systemProperty 'yano.bundle.id', specification.bundleId
            systemProperty 'yano.bundle.expected-ids',
                    closureSpecifications.collect { it.bundleId }.join(',')
        }
    }
}

def generatedRuntimePluginMatrix = layout.buildDirectory.file(
        'reports/repository-split/runtime-plugin-conformance-v1.json')
tasks.register('generateRuntimePluginConformanceMatrix') {
    group = 'verification'
    inputs.files(runtimePluginBundles.collect { specification ->
        project(specification.projectPath).fileTree('src/main/resources/META-INF/yano/plugins') {
            include '*.json'
        }
    })
    outputs.file(generatedRuntimePluginMatrix)
    doLast {
        def rows = runtimePluginBundles.collect { specification ->
            def pluginProject = project(specification.projectPath)
            def sourceManifest = sourceManifestFor(specification)
            def manifests = [sourceManifest.file]
            def manifest = sourceManifest.value
            if (manifest.id != specification.bundleId) {
                throw new GradleException(
                        "${specification.projectPath} manifest id does not match the matrix")
            }
            def suffix = pluginProject.name.split('-')
                    .collect { token -> token.capitalize() }.join('')
            [
                    projectPath: specification.projectPath,
                    bundleId: specification.bundleId,
                    manifest: rootProject.relativePath(manifests.first()),
                    contributions: manifest.contributions.collect { contribution ->
                        [kind: contribution.kind, name: contribution.name,
                         provider: contribution.provider]
                    },
                    dependencyBundles: runtimeBundleClosure(specification)
                            .findAll { it.bundleId != specification.bundleId }
                            .collect { it.bundleId },
                    bundleTasks: runtimeBundleClosure(specification)
                            .collect { "${it.projectPath}:shadowJar" },
                    jvmActivationTest: ":activate${suffix}RuntimePluginBundle"
            ]
        }
        def output = generatedRuntimePluginMatrix.get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(
                        [schemaVersion: 1, runtimeArtifacts: rows])) + '\n', 'UTF-8')
    }
}

tasks.register('verifyRuntimePluginConformanceMatrix') {
    group = 'verification'
    dependsOn tasks.named('generateRuntimePluginConformanceMatrix'), activationTasks
    inputs.file('config/repository-split/runtime-plugin-conformance-v1.json')
    inputs.file(generatedRuntimePluginMatrix)
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def checked = parser.parse(file(
                'config/repository-split/runtime-plugin-conformance-v1.json'))
        def generated = parser.parse(generatedRuntimePluginMatrix.get().asFile)
        if (checked != generated) {
            throw new GradleException(
                    'Runtime plugin conformance matrix is stale; regenerate and review it')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyRuntimePluginConformanceMatrix')
}
}

def getCheckedOutGitCommitHash() {
    try {
        return grgit.head()?.abbreviatedId
    } catch (Exception e) {
        return null
    }
}
