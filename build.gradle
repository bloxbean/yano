// Keep the Quarkus host's Jackson security override observable at build time:
// a direct catalog upgrade is not enough because Quarkus imports its platform
// as an enforced BOM. Yano X verifies its own extension runtime closures.
def adr013ReleaseScopes = [
        app: ':app'
]

tasks.register('verifyAdr013JacksonAlignment') {
    group = 'verification'
    description = 'Rejects vulnerable or mixed Jackson versions in ADR-013 runtime closures'

    doLast {
        def expectedPatchVersion = libs.versions.jackson.get()
        def expectedAnnotationsVersion = expectedPatchVersion.replaceFirst(/\.\d+$/, '')
        def expectedAppModules = [
                'com.fasterxml.jackson:jackson-bom',
                'com.fasterxml.jackson.core:jackson-annotations',
                'com.fasterxml.jackson.core:jackson-core',
                'com.fasterxml.jackson.core:jackson-databind',
                'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor',
                'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml',
                'com.fasterxml.jackson.datatype:jackson-datatype-jdk8',
                'com.fasterxml.jackson.datatype:jackson-datatype-jsr310',
                'com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-base',
                'com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-json-provider',
                'com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations',
                'com.fasterxml.jackson.module:jackson-module-parameter-names'
        ] as Set
        def reportLines = ['scope\tmodule\tversion']
        def failures = []

        adr013ReleaseScopes.each { scope, projectPath ->
            def targetProject = project(projectPath)
            def runtimeClasspath = targetProject.configurations
                    .getByName('runtimeClasspath')
            def modules = runtimeClasspath.incoming.resolutionResult.allComponents
                    .findAll { component ->
                        component.id instanceof
                                org.gradle.api.artifacts.component.ModuleComponentIdentifier
                                && (component.id.group == 'com.fasterxml.jackson'
                                || component.id.group.startsWith('com.fasterxml.jackson.'))
                    }.collectEntries { component ->
                        def id = component.id as
                                org.gradle.api.artifacts.component.ModuleComponentIdentifier
                        [("${id.group}:${id.module}".toString()): id.version]
                    }
            modules.toSorted().each { module, version ->
                reportLines.add("${scope}\t${module}\t${version}".toString())
                def expected = module ==
                        'com.fasterxml.jackson.core:jackson-annotations'
                        ? expectedAnnotationsVersion : expectedPatchVersion
                if (version != expected) {
                    failures.add("${scope} resolves ${module}:${version}; expected ${expected}")
                }
            }
            if (scope == 'app') {
                def missing = expectedAppModules - modules.keySet()
                if (!missing.isEmpty()) {
                    failures.add("app Jackson module inventory is incomplete: ${missing.sort()}")
                }
            }
        }

        def report = layout.buildDirectory.file(
                'reports/adr013/jackson-alignment.tsv').get().asFile
        report.parentFile.mkdirs()
        report.setText(reportLines.join(System.lineSeparator())
                + System.lineSeparator(), 'UTF-8')
        if (!failures.isEmpty()) {
            throw new GradleException('ADR-013 Jackson alignment failed:\n - '
                    + failures.join('\n - '))
        }
        logger.lifecycle('ADR-013 Jackson alignment passed for {} resolved modules; report={}',
                reportLines.size() - 1, report)
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyAdr013JacksonAlignment')
}

tasks.register('verifyAdr013Slf4jAlignment') {
    group = 'verification'
    description = 'Rejects mixed SLF4J APIs or bundled providers in ADR-013 runtime closures'

    doLast {
        def expectedVersion = libs.slf4j.api.get().versionConstraint.requiredVersion
        def expectedModules = ['org.slf4j:slf4j-api'] as Set
        def reportLines = ['scope\tmodule\tversion']
        def failures = []

        adr013ReleaseScopes.each { scope, projectPath ->
            def runtimeClasspath = project(projectPath).configurations
                    .getByName('runtimeClasspath')
            def modules = runtimeClasspath.incoming.resolutionResult.allComponents
                    .findAll { component ->
                        component.id instanceof
                                org.gradle.api.artifacts.component.ModuleComponentIdentifier
                                && component.id.group == 'org.slf4j'
                    }.collectEntries { component ->
                        def id = component.id as
                                org.gradle.api.artifacts.component.ModuleComponentIdentifier
                        [("${id.group}:${id.module}".toString()): id.version]
                    }
            modules.toSorted().each { module, version ->
                reportLines.add("${scope}\t${module}\t${version}".toString())
                if (version != expectedVersion) {
                    failures.add("${scope} resolves ${module}:${version}; expected ${expectedVersion}")
                }
            }
            if (modules.keySet() != expectedModules) {
                failures.add("${scope} SLF4J runtime inventory is ${modules.keySet().sort()}; "
                        + "expected host-provided API only ${expectedModules}")
            }
        }

        def report = layout.buildDirectory.file(
                'reports/adr013/slf4j-alignment.tsv').get().asFile
        report.parentFile.mkdirs()
        report.setText(reportLines.join(System.lineSeparator())
                + System.lineSeparator(), 'UTF-8')
        if (!failures.isEmpty()) {
            throw new GradleException('ADR-013 SLF4J alignment failed:\n - '
                    + failures.join('\n - '))
        }
        logger.lifecycle('ADR-013 SLF4J alignment passed for {} runtime closures; report={}',
                adr013ReleaseScopes.size(), report)
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyAdr013Slf4jAlignment')
}

def firstPartyPluginManifestTemplates = fileTree(rootProject.projectDir) {
    include 'appchain/**/src/main/resources/META-INF/yano/plugins/*.json'
}
def firstPartyPluginManifestTemplateFiles = firstPartyPluginManifestTemplates.files

tasks.register('verifyFirstPartyPluginManifestTemplates') {
    group = 'verification'
    description = 'Validates generated-version placeholders in first-party plugin manifests.'
    inputs.files(firstPartyPluginManifestTemplateFiles)

    doLast {
        def failures = []
        firstPartyPluginManifestTemplateFiles.sort { left, right ->
            left.path <=> right.path
        }.each { manifestFile ->
            def manifestTemplate = manifestFile.getText('UTF-8')
            def pluginManifest = new groovy.json.JsonSlurper().parseText(manifestTemplate)
            if (pluginManifest.version != '${pluginVersion}') {
                failures.add("first-party plugin version must be generated: "
                        + rootProject.projectDir.toPath().relativize(manifestFile.toPath()))
            }
            def templateKeys = (manifestTemplate =~ /\$\{([^}]+)\}/).collect {
                it[1]
            }.toSet()
            if (templateKeys != ['pluginVersion'] as Set) {
                failures.add("first-party plugin template keys must be [pluginVersion]: "
                        + rootProject.projectDir.toPath().relativize(manifestFile.toPath())
                        + " has ${templateKeys.sort()}")
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('First-party plugin manifest template verification failed:\n - '
                    + failures.join('\n - '))
        }
        logger.lifecycle('First-party plugin manifest templates verified: {} files',
                firstPartyPluginManifestTemplateFiles.size())
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyFirstPartyPluginManifestTemplates')
}

tasks.register('verifyLegacyAccountHistoryRemoved') {
    group = 'verification'
    description = 'Prevents the removed synchronous account-history implementation from returning.'

    doLast {
        def forbiddenPaths = [
                'ledger-state/src/main/java/com/bloxbean/cardano/yano/ledgerstate/AccountHistoryCborCodec.java',
                'ledger-state/src/main/java/com/bloxbean/cardano/yano/ledgerstate/AccountHistoryCfNames.java',
                'ledger-state/src/main/java/com/bloxbean/cardano/yano/ledgerstate/AccountHistoryEventHandler.java',
                'ledger-state/src/main/java/com/bloxbean/cardano/yano/ledgerstate/AccountHistoryStore.java',
                'runtime/src/main/java/com/bloxbean/cardano/yano/runtime/ledger/AccountHistorySubsystem.java'
        ]
        def failures = forbiddenPaths.findAll { file(it).exists() }
                .collect { "removed file exists: ${it}" }
        def forbiddenTokens = [
                'AccountHistoryStore',
                'AccountHistoryEventHandler',
                'AccountHistorySubsystem',
                'AccountHistoryCborCodec',
                'AccountHistoryCfNames',
                'YanoPropertyKeys.AccountHistory',
                'getAccountHistoryProvider'
        ]
        fileTree(rootProject.projectDir) {
            include '**/src/main/**/*.java'
            exclude '**/build/**'
            exclude '.claude/worktrees/**'
        }.files.each { source ->
            def text = source.getText('UTF-8')
            forbiddenTokens.each { token ->
                if (text.contains(token)) {
                    failures.add("${rootProject.projectDir.toPath().relativize(source.toPath())} contains ${token}")
                }
            }
        }
        fileTree(rootProject.projectDir) {
            include 'app/src/main/resources/**/*.yml'
            include 'app/config/**/*.yml'
        }.files.each { configFile ->
            if (configFile.getText('UTF-8').contains('account-history:')) {
                failures.add("supported config still declares account-history: "
                        + rootProject.projectDir.toPath().relativize(configFile.toPath()))
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Legacy synchronous account history removal verification failed:\n - '
                    + failures.join('\n - '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyLegacyAccountHistoryRemoved')
}

