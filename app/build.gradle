tasks.register('normalizeYanoReleaseSbom') {
    dependsOn rootProject.tasks.named('cyclonedxBom')
    group = 'distribution'
    description = 'Normalizes and license-checks the Yano CycloneDX release SBOM.'
    inputs.file(aggregateSbom)
    inputs.file(rootProject.file('LICENSE'))
    inputs.file(releaseLicenseOverrides)
    outputs.file(releaseSbom)

    doLast {
        def body = new groovy.json.JsonSlurper().parse(aggregateSbom.get().asFile)
        if (body.bomFormat != 'CycloneDX' || body.specVersion != '1.6'
                || body.metadata?.component?.name != 'yano'
                || body.metadata.component.version != project.version.toString()
                || !(body.components instanceof Collection)
                || body.components.isEmpty()) {
            throw new GradleException('Yano aggregate SBOM identity is incomplete')
        }
        body.remove('serialNumber')
        body.metadata.remove('timestamp')
        def mitLicense = [[license: [id: 'MIT']]]
        def repositoryReference = [[
                type: 'vcs',
                url: 'https://github.com/bloxbean/yano.git'
        ]]
        body.metadata.component.remove('licenses')
        body.metadata.component.remove('externalReferences')
        body.metadata.component.licenses = mitLicense
        body.metadata.component.externalReferences = repositoryReference
        body.components.findAll { component ->
            component.group?.toString()?.startsWith('com.bloxbean.cardano')
        }.each { component ->
            component.remove('licenses')
            component.remove('externalReferences')
            component.licenses = mitLicense
            component.externalReferences = repositoryReference
        }
        def overrideDocument = new groovy.json.JsonSlurper().parse(
                releaseLicenseOverrides)
        if (overrideDocument.schemaVersion != 1
                || !(overrideDocument.overrides instanceof Collection)) {
            throw new GradleException('Yano release license overrides are invalid')
        }
        def licenseOverrides = overrideDocument.overrides.collectEntries { override ->
            [("${override.group}:${override.name}:${override.version}".toString()):
                    [[license: override.license]]]
        }
        def usedLicenseOverrides = [] as Set
        body.components.each { component ->
            def coordinate =
                    "${component.group}:${component.name}:${component.version}".toString()
            if ((!(component.licenses instanceof Collection)
                    || component.licenses.isEmpty())
                    && licenseOverrides.containsKey(coordinate)) {
                component.licenses = licenseOverrides[coordinate]
                usedLicenseOverrides.add(coordinate)
            }
        }
        if (usedLicenseOverrides != licenseOverrides.keySet()) {
            throw new GradleException(
                    'Unused or shadowed Yano release license overrides: '
                            + (licenseOverrides.keySet() - usedLicenseOverrides).sort())
        }
        def externalWithoutLicense = body.components.findAll { component ->
            !component.group?.toString()?.startsWith('com.bloxbean.cardano')
                    && (!(component.licenses instanceof Collection)
                    || component.licenses.isEmpty())
        }.collect { component ->
            "${component.group}:${component.name}:${component.version}"
        }.sort()
        if (!externalWithoutLicense.isEmpty()) {
            throw new GradleException(
                    'External SBOM components lack license metadata: '
                            + externalWithoutLicense)
        }
        def output = releaseSbom.get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(body)) + '\n', 'UTF-8')
    }
}
def nativeBuildArgsProperty = 'quarkus.native.additional-build-args'
def nativeContainerRuntimeOptionsProperty = 'quarkus.native.container-runtime-options'

def getNativeBuildArgs = {
    def raw = System.getProperty(nativeBuildArgsProperty)
    if (raw == null || raw.isBlank()) {
        return []
    }

    return raw.split(',')
            .collect { it.trim() }
            .findAll { !it.isBlank() }
}

def addNativeBuildArgs = { List<String> additions ->
    def args = getNativeBuildArgs()
    additions.each { arg ->
        if (!args.contains(arg)) {
            args.add(arg)
        }
    }

    if (!args.isEmpty()) {
        System.setProperty(nativeBuildArgsProperty, args.join(','))
    }
}

def getNativeContainerRuntimeOptions = {
    def raw = System.getProperty(nativeContainerRuntimeOptionsProperty)
    if (raw == null || raw.isBlank()) {
        return []
    }

    return raw.split(',')
            .collect { it.trim() }
            .findAll { !it.isBlank() }
}

def addNativeContainerRuntimeOptions = { List<String> additions ->
    def options = getNativeContainerRuntimeOptions()
    additions.each { option ->
        if (!options.contains(option)) {
            options.add(option)
        }
    }

    if (!options.isEmpty()) {
        System.setProperty(nativeContainerRuntimeOptionsProperty, options.join(','))
    }
}

def hasNativeContainerWorkdir = {
    def options = getNativeContainerRuntimeOptions()
    for (int i = 0; i < options.size(); i++) {
        def option = options[i]
        if (option == '-w' || option == '--workdir' || option.startsWith('-w=') || option.startsWith('--workdir=')) {
            return true
        }
    }

    return false
}

def isNativeBuildRequested = {
    def nativeEnabled = System.getProperty('quarkus.native.enabled', '')
    if (nativeEnabled.equalsIgnoreCase('true')) {
        return true
    }

    return System.getProperty('quarkus.profile', '')
            .split(',')
            .collect { it.trim() }
            .any { it == 'native' }
}

def isNativeContainerBuildRequested = {
    System.getProperty('quarkus.native.container-build', '').equalsIgnoreCase('true') ||
