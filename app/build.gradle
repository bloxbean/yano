// ADR-011.2 packaged/native conformance: activate every typed fixture through
// the real catalog-owned app-chain path. The fixture deliberately poisons its
// provider-callback TCCL, so successful product callbacks also prove facade
// mediation rather than raw ServiceLoader reachability.
def pluginConformanceBundleId =
        'com.bloxbean.cardano.yano.fixture.plugin-conformance'
def pluginConformanceMemberKey = '00' * 32
def pluginOperationsSmokeApiKey = 'plugin-operations-smoke-full-key'
def bakedApiPathPrefix = {
    String prefix = bakedApiPrefix.get()
    prefix == '/' ? '' : prefix
}

def pluginOperationsAuthArguments = {
    [
            '-Dyano.app-chain.api.auth.enabled=false',
            "-Dyano.app-chain.api.keys=${pluginOperationsSmokeApiKey}"
    ].collect { it.toString() }
}

def allocateLoopbackPorts = { int count ->
    if (count <= 0) {
        throw new IllegalArgumentException('loopback port count must be positive')
    }
    def address = java.net.InetAddress.getByName('127.0.0.1')
    def sockets = []
    try {
        count.times {
            sockets.add(new java.net.ServerSocket(0, 1, address))
        }
        return sockets.collect { it.localPort }
    } finally {
        sockets.reverseEach { it.close() }
    }
}

