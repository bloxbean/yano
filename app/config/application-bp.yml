# Slot-leader block producer profile for a public network.
# Combine with a network profile, for example: preview,bp
# Put the pool's VRF key, KES key and operational certificate in config/keys/ (or change the paths below).
# Run exactly one producer per pool key set.

yano:
  block-producer:
    enabled: true
    slot-leader-mode: true
    vrf-skey-file: config/keys/vrf.skey
    kes-skey-file: config/keys/kes.skey
    opcert-file: config/keys/opcert.cert
