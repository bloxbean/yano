# Yano - Operator Override Configuration
# -------------------------------------
# Properties here override the defaults bundled in the jar.
# This base file stays conservative: single trusted upstream/indexer style.
#
# Compose profiles by passing a comma-separated Quarkus profile list:
#
#   ./yano.sh start:preprod,relay
#   ./yano.sh start:preprod,relay,praos-lite
#   ./yano.sh start:mainnet,trusted-peers
#
# Profile files live beside this file as application-<profile>.yml.
#
# The standard defaults target a dedicated machine with at least 3 GiB RAM;
# 4 GiB is recommended. For the JVM-jar distribution, start with:
#   JAVA_OPTS="-Xmx768m"

quarkus:
  http:
    # REST API, health, metrics, Swagger UI, and the node console.
    port: 7070
  log:
    level: INFO
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
    file:
      enabled: true
      path: ./yano.log
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"

yano:
  # Cardano N2N server. Give every node on the same host a distinct port.
  server:
    port: 13337

  # Primary L1 RocksDB state. Never point two running nodes at the same path.
  storage:
    path: ./chainstate

  # For public-network epochs with bundled expected AdaPot values, Yano verifies
  # the calculated treasury and reserves automatically.
  # false: log mismatches, expose details through /api/v1/node/epoch-calc-status,
  #        and continue.
  # true: terminate the node on a mismatch so the epoch can be investigated.
  exit-on-epoch-calc-error: false

  epoch-boundary:
    # Use bounded-memory streaming reward calculation when the required
    # pool-major snapshot is complete. Otherwise, use the legacy reward path.
    reward-mode: streaming

    # Flush epoch-boundary RocksDB work when either threshold is reached.
    # These limits apply to delegation snapshot rows, streaming reward chunks,
    # and temporary reward-credential flags. The byte limit is an estimate,
    # not a strict process-memory cap. Both values must be positive.
    max-batch-operations: 10000
    max-batch-bytes: 4194304 # 4 MiB

  # Optional umbrella for coherent UTXO/account-state rollback retention.
  # Explicit lower-level retention properties still take precedence.
  # rollback-retention-epochs: 20
