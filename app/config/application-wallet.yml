# Wallet profile: discovery and transaction scans without archival history.
# Enable before initial sync into a fresh database for complete coverage.
# Compose after a network profile, for example:
#   ./yano.sh start:preprod,wallet
#   ./yano.sh start:mainnet,wallet

yano:
  scan:
    index:
      enabled: true
  address-first-seen:
    enabled: true
  chain:
    block-body-prune-depth: 0
  utxo:
    enabled: true
  filters:
    utxo:
      enabled: false
