# Wallet-serving profile with minimal confirmed transaction history.
#
# Compose after a network profile, for example:
#   ./yano.sh start:preprod,wallet
#   ./yano.sh start:mainnet,wallet
#
# This profile serves stake-credential transaction history from genesis, so it is
# FRESH SYNC ONLY. Pruned block bodies are not the constraint: the projection
# startup guard refuses any existing chainstate that was not built with a matching
# projection identity, whatever its body retention. Point it at an empty storage
# directory.

yano:
  account-state:
    enabled: true
  account:
    stake-balance-index-enabled: true
  adapot:
    enabled: true
  rewards:
    enabled: true
  epoch-params:
    tracking-enabled: true
  governance:
    enabled: true
  history:
    dir: ${YANO_HISTORY_DIR:./history}
    # History is written by the canonical projection outbox. The older replay-worker archive
    # this profile used to configure no longer exists, and its keys are rejected rather than
    # ignored - so start-mode, hot-store, worker and datasets are gone from here because
    # setting them now stops the node.
    #
    # What a wallet node can and cannot choose. Block sections are selectable, but the choice
    # is part of the archive identity: it is made once at fresh sync and cannot be widened or
    # narrowed afterwards, because the startup guard refuses an archive whose section set
    # differs. Epoch artifacts are not selectable at all - reward, epoch-stake, ada-pot,
    # drep-distribution and governance-proposal-status always ship - so this profile can no
    # longer switch rewards off. The per-subject choice it once made for address transactions
    # (address vs payment credential vs stake credential) is gone with the replay worker.
    #
    # The archive engine is DuckLake only. SQLite has not left the stack - DuckLake keeps its
    # catalog in one - but it is no longer something to select here.
    projection:
      enabled: true
      sink: ducklake
      # Every selectable section, with the version that ships today:
      #   transaction:v1         - chain transactions
      #   utxo-history:v1        - outputs, inputs, assets, datums, redeemers
      #   account-events:v1      - stake registration, delegation, withdrawal events
      #   address-transaction:v1 - address and credential to transaction index
      #
      # A wallet serves address history, so it carries that section alone. Widening this
      # later requires resyncing from genesis, and an archive missing a section looks
      # healthy until a query over it returns nothing.
      sections: address-transaction:v1
    archive:
      engine: ducklake
      finality-blocks: auto
    rollback:
      retention-blocks: auto
