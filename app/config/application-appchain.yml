# yaml-language-server: $schema=./schema/appchain-runtime.schema.json
# =============================================================================
# App-chain cluster demo config  (external — lives in app/config, NOT bundled
# in the jar). Activated with the `appchain` Quarkus profile, e.g.
#   -Dquarkus.profile=devnet,appchain
# The cluster launcher (app/appchain-cluster/cluster.sh) adds this profile for
# you and injects the per-node/topology values.
#
# WHAT THIS FILE DEFINES (shared, identical on every node): the per-chain
# "flavor" — chain-id, state machine, block cadence, and sequencer intent.
#
# WHAT THE LAUNCHER INJECTS (differs per node / per cluster size): members,
# threshold, this node's signing-key, peers, and — for fixed-proposer chains —
# the proposer. So the SAME file runs unchanged on a 3-node or a 9-node
# cluster; you never hand-edit member lists here.
#
# ADD / REMOVE CHAINS FREELY: any chains[i] with a chain-id is hosted. The
# launcher auto-discovers however many you define (indices must start at 0 and
# be contiguous). Each chain is fully independent — its own ledger, state
# machine, members view, sequencer and (optional) L1 anchor.
# =============================================================================
yano:
  app-chain:
    # Node-local root; each hosted chain gets a <chain-id>/ RocksDB below it.
    # Relative paths use the process working directory.
    storage:
      path: ${YANO_APP_CHAIN_STORAGE_PATH:appchain-chainstate}
    indexer:
      storage:
        path: ${YANO_APP_CHAIN_INDEXER_STORAGE_PATH:appchain-indexers}

    # --- Chain 0: an append-only ordered log, fixed proposer (node 0) --------
    chains[0]:
      chain-id: "orders-chain"
      state-machine: ordered-log        # built-in: append-only log (default)
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: c2b9c92a865dfa7c218a1a6e49f1dd88163372e40466009876458c01609d0d70
      membership:
        mode: governed                  # later members join through finalized governance
      block:
        interval-ms: 1000               # propose a block every ~1s
        # block.max-bytes (default 4 MiB) is the primary size cap; the proposer
        # trims each block to fit it. max-messages (default 5000) is a safety
        # backstop against tiny-message floods. Tune either for throughput.
      # No sequencer.mode → fixed proposer; the launcher injects
      # sequencer.proposer = node 0's member key. To rotate instead, add:
      #   sequencer:
      #     mode: rotating
      #     window-slots: 10

    # --- Chain 1: a key/value registry, rotating sequencer -------------------
    chains[1]:
      chain-id: "registry-chain"
      state-machine: kv-registry        # built-in: owner-guarded K/V registry
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: cd4f0bac8a0d8c7fd5700510eae8c69256172814b219e9e3b1a914fc89c358b3
      membership:
        mode: governed
      block:
        interval-ms: 2000
      sequencer:
        mode: rotating                  # L1-slot-clocked rotation across members
        window-slots: 10                # ~10 devnet slots (~10s) per proposer turn
      machines:
        kv-registry:
          value-format: utf8            # PUT values must be valid UTF-8

    # --- Chain 2: approval workflow + dependency-free effects demo ----------
    # `cluster effect demo ["message"]` submits a one-approval workflow, claims its effect
    # through the external-worker API, reports success, and checks that the
    # finalized effect proof is available. No Kafka/S3/IPFS service or
    # credential is needed.
    chains[2]:
      chain-id: "effects-chain"
      state-machine: approvals
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: 63281a4424bed827004e10185a663bce10de4228953d3959e2ed20aa3a4a9f0b
      membership:
        mode: governed
      block:
        interval-ms: 1000
      effects:
        enabled: true
        default-gate: app-final
        external:
          enabled: true
        executor:
          enabled: true
          types: demo.webhook
          tick-ms: 250
        metrics:
          types: demo.webhook
      machines:
        approvals:
          on-approved-effect:
            enabled: true
            type: demo.webhook
            gate: app-final
            expiry-blocks: 100
          activations:
            on-approved-effect: 1

    # --- Add more chains here, e.g. a fourth with L1 anchoring ---------------
    # chains[3]:
    #   chain-id: "audit-chain"
    #   state-machine: ordered-log
    #   block:
    #     interval-ms: 1000
    #   anchor:
    #     enabled: true
    #     mode: script                  # ADR 008.4 script anchors (A2)
    #     # signing-key + every-blocks are injected by `cluster.sh --anchor`
