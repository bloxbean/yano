# =============================================================================
# Standalone app-chain demo config (external — lives in app/config, not in the
# application JAR). Activate it with the `appchain` Quarkus profile, for example:
#   ./yano.sh start:devnet,appchain
#
# Direct use starts the built-in ordered-log application as a single-member
# demo. The deterministic identity below is for local testing only and must
# never be used in production.
#
# seed = 0101010101010101010101010101010101010101010101010101010101010101
# pub  = 8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c
#
# Yano contains the app-chain host and ordered-log application. Install JVM
# extensions, or use the Yano X showcase, for additional state machines.
# =============================================================================
yano:
  app-chain:
    storage:
      path: ${YANO_APP_CHAIN_STORAGE_PATH:appchain-chainstate}
    chains[0]:
      chain-id: "orders-chain"
      signing-key: "0101010101010101010101010101010101010101010101010101010101010101"
      members: "8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c"
      threshold: 1
      state-machine: ordered-log
      state:
        commitment-profile: mpf-blake2b256-v1
        format-fingerprint: 91ee14091200f1e24659112d640e877e9177779dcc81dd06117f013e9190082b
        genesis-id: c2b9c92a865dfa7c218a1a6e49f1dd88163372e40466009876458c01609d0d70
      membership:
        mode: governed
      block:
        interval-ms: 1000               # propose a block every ~1s
        # block.max-bytes (default 4 MiB) is the primary size cap; the proposer
        # trims each block to fit it. max-messages (default 5000) is a safety
        # backstop against tiny-message floods. Tune either for throughput.
      # No sequencer.mode → fixed proposer; the launcher injects
      # sequencer.proposer = node 0's member key. To rotate instead, add:
      #   sequencer:
      #     mode: rotating
      #     window-slots: 10

    # --- Chain 1: a key/value registry, rotating sequencer -------------------
    chains[1]:
      chain-id: "registry-chain"
      state-machine: kv-registry        # built-in: owner-guarded K/V registry
      block:
        interval-ms: 2000
      sequencer:
        proposer: "8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c"
