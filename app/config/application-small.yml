# Small-machine profile for memory-bounded sync.
#
# Compose after a network profile, for example:
#   ./yano.sh start:mainnet,small
#
# Selecting this profile makes yano.sh use -Xmx384m for JVM and native
# distributions. Override it explicitly, for example: JAVA_OPTS="-Xmx512m".
# A 384 MiB maximum heap has completed mainnet full-sync validation.
#
# Native-image memory sizing will be documented after separate validation.

yano:
  ledger-apply:
    max-queued-decoded-bytes: 4194304 # 4 MiB encoded-block queue budget
  rocksdb:
    block-cache-bytes: 134217728      # 128 MiB shared read cache
    write-buffer-bytes: 134217728     # 128 MiB aggregate write buffers
    max-background-jobs: 2
    max-open-files: 256
    target-file-size-bytes: 67108864  # 64 MiB SST target
    write-buffer-allow-stall: false
