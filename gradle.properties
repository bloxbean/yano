group = org.yanoproject
artifactId = yano
version = 0.1.0-pre15-dev1
# Release side effects of a v* tag, independent of the Maven Central deployment.
# A Central deployment is staged and still needs a human to publish it, but each
# of these is public the moment the tag is pushed. With all three false a tag
# builds, validates and stages Maven Central and does nothing else, so a release
# can be rehearsed end to end without publishing anything.
# A Docker image and an npm version can never be replaced under the same version;
# a GitHub release can be deleted, but it still notifies watchers.
docker_publish = false
npm_publish = false
github_release = false
quarkusPluginVersion = 3.33.2.1
quarkusPlatformGroupId = io.quarkus.platform
quarkusPlatformArtifactId = quarkus-bom
quarkusPlatformVersion = 3.33.2.1
org.gradle.caching = true
