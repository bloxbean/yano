group = org.yanoproject
artifactId = yano
version = 0.1.0-pre15-dev1
# Release side effects of a v* tag, independent of the Maven Central deployment.
# A Central deployment is staged and still needs a human to publish it, but a
# Docker image and an npm package are public the moment they are pushed and can
# never be replaced under the same version. Set these false to tag a dev build
# that only exercises Maven Central staging.
docker_publish = false
npm_publish = false
quarkusPluginVersion = 3.33.2.1
quarkusPlatformGroupId = io.quarkus.platform
quarkusPlatformArtifactId = quarkus-bom
quarkusPlatformVersion = 3.33.2.1
org.gradle.caching = true
