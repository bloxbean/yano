group = org.yanoproject
artifactId = yano
version = 0.1.0-pre18-SNAPSHOT
# Where a v* tag publishes the Maven artifacts. Both are built and signed once, so
# with both true the same files go to both. A Maven Central deployment is staged
# and still needs a human to publish it (publish-central.yml); the BloxBean
# repository (https://repo.bloxbean.org/maven/releases) is public, and permanent,
# the moment the release run uploads it. Turn Central off to release to the
# BloxBean repository only, e.g. a patch while Central's quota is exhausted.
maven_central_publish = true
bloxbean_repo_publish = true
# Other release side effects of a v* tag, each public the moment the tag is
# pushed. With every flag in this file false a tag only builds and validates, so
# a release can be rehearsed end to end without publishing anything.
# A Docker image and an npm version can never be replaced under the same version;
# a GitHub release can be deleted, but it still notifies watchers.
docker_publish = true
npm_publish = true
github_release = true
quarkusPluginVersion = 3.33.2.1
quarkusPlatformGroupId = io.quarkus.platform
quarkusPlatformArtifactId = quarkus-bom
quarkusPlatformVersion = 3.33.2.1
org.gradle.caching = true
