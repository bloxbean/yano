# SDK compatibility suite - MANUAL ONLY.
#
# There is deliberately no `push` or `pull_request` trigger: this suite is adhoc by
# design (adr/053-sdk-compatibility-and-load-suite.md). It is not part of `build`,
# `extendedTest`, `distributionCheck`, or `fullBuild`, and must not be added to them.
name: SDK Compat Suite

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Yano API base URL. Leave empty to build this ref and start a devnet in the job.'
        required: false
        default: ''
      kinds:
        description: 'Which cases to run'
        required: true
        default: 'compat-only'
        type: choice
        options:
          - compat-only
          - load-only
          - all
      label:
        description: 'Results label (default: the run number)'
        required: false
        default: ''
      check_endpoints:
        description: 'Also capture and diff SDK endpoint usage'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew compat-tests/ccl/gradlew compat-tests/run-suite.sh compat-tests/bin/with-devnet.sh

      # Inputs reach the scripts through env, never inline expressions.
      - name: Resolve options
        id: opts
        env:
          KINDS: ${{ inputs.kinds }}
          LABEL: ${{ inputs.label }}
          RUN_NUMBER: ${{ github.run_number }}
          CHECK_ENDPOINTS: ${{ inputs.check_endpoints }}
        run: |
          case "$KINDS" in
            compat-only) echo "flags=--compat-only" >> "$GITHUB_OUTPUT" ;;
            load-only)   echo "flags=--load-only"   >> "$GITHUB_OUTPUT" ;;
            *)           echo "flags="              >> "$GITHUB_OUTPUT" ;;
          esac
          label="$LABEL"
          [ -n "$label" ] || label="run-${RUN_NUMBER}"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          if [ "$CHECK_ENDPOINTS" = 'true' ]; then
            echo "endpoints=--check-endpoints" >> "$GITHUB_OUTPUT"
          else
            echo "endpoints=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run against the supplied node
        if: inputs.url != ''
        env:
          URL: ${{ inputs.url }}
          LABEL: ${{ steps.opts.outputs.label }}
          FLAGS: ${{ steps.opts.outputs.flags }}
          ENDPOINTS: ${{ steps.opts.outputs.endpoints }}
        run: |
          # FLAGS and ENDPOINTS are fixed option words (or empty) chosen above, so they stay unquoted.
          # shellcheck disable=SC2086
          compat-tests/run-suite.sh \
            --url "$URL" \
            --label "$LABEL" \
            $FLAGS $ENDPOINTS

      - name: Build this ref, start a devnet, and run
        if: inputs.url == ''
        env:
          LABEL: ${{ steps.opts.outputs.label }}
          FLAGS: ${{ steps.opts.outputs.flags }}
          ENDPOINTS: ${{ steps.opts.outputs.endpoints }}
        run: |
          # shellcheck disable=SC2086
          compat-tests/bin/with-devnet.sh -- \
            --label "$LABEL" \
            $FLAGS $ENDPOINTS

      - name: Publish summary
        if: always()
        env:
          LABEL: ${{ steps.opts.outputs.label }}
        run: |
          summary="compat-tests/results/${LABEL}/SUMMARY.md"
          [ -f "$summary" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY" || \
            echo 'No summary produced - the suite failed before reporting.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-results-${{ steps.opts.outputs.label }}
          path: compat-tests/results/
          if-no-files-found: warn
