name: Release Distribution

# On a v* tag: builds the JVM and native distribution zips, publishes the npm testkit packages
# (npm_publish, npm trusted publishing through OIDC, no token) and creates the GitHub release with the
# zips (github_release). Both flags live in gradle.properties. No job holds release secrets.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_final: ${{ steps.version.outputs.is_final }}
      version: ${{ steps.version.outputs.version }}
      npm_publish: ${{ steps.version.outputs.npm_publish }}
      github_release: ${{ steps.version.outputs.github_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(./gradlew -q properties | awk '/^version:/ { print $2; exit }')
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match Gradle version ${VERSION}" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT* ]]; then
            echo "Release tags require a non-SNAPSHOT version. Got: $VERSION" >&2
            exit 1
          fi

          IS_FINAL=false
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_FINAL=true
          fi

          echo "is_final=$IS_FINAL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # An npm version is public and immutable once published, so it is
          # opt-in per release rather than an automatic consequence of tagging.
          NPM_PUBLISH=$(./gradlew -q properties | awk '/^npm_publish:/ { print $2; exit }')
          echo "npm_publish=${NPM_PUBLISH:-false}" >> "$GITHUB_OUTPUT"
          echo "npm publish for this tag: ${NPM_PUBLISH:-false}"
          # A GitHub release is deletable, unlike npm and Docker, but it still
          # notifies watchers and advertises the tag as a real release. Gating it
          # lets a tag rehearse the whole pipeline and stage Maven Central only.
          GITHUB_RELEASE=$(./gradlew -q properties | awk '/^github_release:/ { print $2; exit }')
          echo "github_release=${GITHUB_RELEASE:-false}" >> "$GITHUB_OUTPUT"
          echo "GitHub release for this tag: ${GITHUB_RELEASE:-false}"

  jar-dist:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build uber-jar distribution
        run: ./gradlew :app:yanoDistZip -PskipSigning=true
      - name: Smoke test packaged JVM plugin catalog
        run: ./gradlew :app:packagedJvmPluginCatalogSmoke -PskipSigning=true
      - name: Upload JAR distribution
        uses: actions/upload-artifact@v4
        with:
          name: jar-dist
          path: app/build/distributions/yano-*.zip

  native-dist:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
          - os: ubuntu-22.04-arm
            label: linux-arm64
          - os: macos-15
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Oracle GraalVM 25.3
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          version: '25.3'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Oracle GraalVM release
        if: runner.os != 'Windows'
        shell: bash
        run: native-image --version | grep -F 'Oracle GraalVM 25.3'
      - name: Verify Oracle GraalVM release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nativeImageVersion = native-image --version 2>&1 | Out-String
          if ($nativeImageVersion -notmatch 'Oracle GraalVM 25\.3') {
            throw "Expected Oracle GraalVM 25.3, got: $nativeImageVersion"
          }
          Write-Output $nativeImageVersion
      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Build native binary
        if: runner.os != 'Windows'
        run: ./gradlew :app:quarkusBuild -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false -PskipSigning=true
      - name: Build native binary on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:quarkusBuild "-Dquarkus.native.enabled=true" "-Dquarkus.package.jar.enabled=false" "-PskipSigning=true"
      - name: Verify native image uses G1
        if: runner.os != 'Windows'
        shell: bash
        run: grep -F '"garbage_collector":"G1 GC"' app/build/yano-native-image-source-jar/yano-build-output-stats.json
      - name: Package native distribution
        if: runner.os != 'Windows'
        run: ./gradlew :app:yanoNativeDistZip -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false -PskipSigning=true
      - name: Package native distribution on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:yanoNativeDistZip "-Dquarkus.native.enabled=true" "-Dquarkus.package.jar.enabled=false" "-PskipSigning=true"
      - name: Smoke test packaged native plugin catalog
        if: runner.os != 'Windows'
        run: ./gradlew :app:nativePluginCatalogSmoke -PskipSigning=true
      - name: Smoke test packaged native plugin catalog on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:nativePluginCatalogSmoke "-PskipSigning=true"
      - name: Upload native distribution
        uses: actions/upload-artifact@v4
        with:
          name: native-dist-${{ matrix.label }}
          path: app/build/distributions/yano-native-*.zip

  npm-publish:
    needs: [validate, native-dist]
    # Gated by npm_publish in gradle.properties; see the validate job.
    if: needs.validate.outputs.npm_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-dist-*
          path: native-artifacts

      - name: Set npm package versions
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: node npm/scripts/set-package-version.mjs "$VERSION"

      - name: Populate platform npm packages
        shell: bash
        run: |
          set -euo pipefail

          copy_package() {
            local label="$1"
            local package_dir="$2"
            local binary_name="$3"
            local zip_path
            zip_path=$(find native-artifacts -name "yano-native-*-${label}.zip" -print -quit)
            if [[ -z "$zip_path" ]]; then
              echo "Missing native artifact for ${label}" >&2
              exit 1
            fi

            local tmp_dir
            tmp_dir=$(mktemp -d)
            unzip -q "$zip_path" -d "$tmp_dir"
            local dist_root
            dist_root=$(find "$tmp_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)
            if [[ -z "$dist_root" ]]; then
              echo "Native artifact ${zip_path} did not contain a distribution directory" >&2
              exit 1
            fi

            rm -rf "npm/${package_dir}/bin" "npm/${package_dir}/config"
            mkdir -p "npm/${package_dir}/bin"
            cp "${dist_root}/${binary_name}" "npm/${package_dir}/bin/${binary_name}"
            cp -R "${dist_root}/config" "npm/${package_dir}/config"
            chmod +x "npm/${package_dir}/bin/${binary_name}" || true
          }

          copy_package linux-x64 yano-testkit-linux-x64 yano
          copy_package linux-arm64 yano-testkit-linux-arm64 yano
          copy_package macos-arm64 yano-testkit-macos-arm64 yano
          copy_package windows-x64 yano-testkit-windows-x64 yano.exe

      - name: Validate npm packages
        working-directory: npm
        run: |
          npm run install:testkit
          npm test
          npm run typecheck
          npm run check:versions
          npm run pack:dry

      - name: Publish npm packages
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          NPM_TAG=latest
          if [[ "$VERSION" == *"-preview"* || "$VERSION" == *"-pre"* || "$VERSION" == *"-alpha"* ]]; then
            NPM_TAG=preview
          elif [[ "$VERSION" == *"-beta"* ]]; then
            NPM_TAG=beta
          elif [[ "$VERSION" == *"-rc"* ]]; then
            NPM_TAG=next
          fi

          for package_dir in \
            yano-testkit-linux-x64 \
            yano-testkit-linux-arm64 \
            yano-testkit-macos-arm64 \
            yano-testkit-windows-x64 \
            yano-testkit; do
            npm publish "./npm/${package_dir}" --access public --provenance --tag "$NPM_TAG"
          done

  release:
    needs: [validate, jar-dist, native-dist, npm-publish]
    # Gated by github_release in gradle.properties. npm-publish is skipped when
    # npm_publish is false, and a skipped dependency would otherwise skip this
    # job too, so it is checked by result rather than by default behaviour: the
    # release still ships the jar and native distributions when npm publishing is
    # off, and only a genuine npm failure blocks it.
    if: >-
      !cancelled()
      && needs.validate.outputs.github_release == 'true'
      && needs.jar-dist.result == 'success'
      && needs.native-dist.result == 'success'
      && needs.npm-publish.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      # Creates the release for the tag, or adds the assets if it already exists. Do not pre-create a draft
      # release for the tag: the action publishes an existing draft.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.zip
          generate_release_notes: false
          prerelease: ${{ needs.validate.outputs.is_final != 'true' }}
          # Latest is decided by semantic version and date, so a maintenance release does not take the
          # Latest badge.
          make_latest: legacy
