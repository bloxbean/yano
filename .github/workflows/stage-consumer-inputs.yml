name: Stage Consumer Inputs

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Stage only the foundation APIs, or every host publication and the JVM ZIP
        type: choice
        default: host
        options: [foundation, host]

permissions:
  contents: read

jobs:
  stage-consumer-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Stage exact foundation or host publications
        id: stage
        env:
          YANO_INPUTS_SCOPE: ${{ inputs.scope }}
        run: bash .github/scripts/stage-consumer-inputs.sh
      - name: Retain qualification inputs (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: yano-inputs-${{ github.sha }}
          path: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          retention-days: 90
