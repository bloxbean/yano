name: Documentation

on:
  pull_request:
    paths: ['www/**', '.github/workflows/docs.yml', 'app/config/**', 'app/src/main/**', 'core-api/src/main/**', 'gradle.properties']
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/docs.yml', 'app/config/**', 'app/src/main/**', 'core-api/src/main/**', 'gradle.properties']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run generate
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: yano-docs-preview
          path: www/dist
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: www/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
