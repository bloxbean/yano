name: Release Docker Images

# Builds, smoke-tests and publishes the JVM and native Docker images and the Docker Compose zip.
#
# Called by release.yml for a v* tag when docker_publish = true in gradle.properties, or started by hand:
# a dry run (the default) builds and smoke-tests any ref without credentials; a manual publish needs
# maven_staging_confirmed and the release tag.
#
# The Docker Hub credentials (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN) are secrets of the release-staging
# environment, which only accepts v* tags, main and release/**. Only the push jobs name it, and they run no
# repository code: they download the Docker build contexts that the credential-free build jobs of the same
# run prepared and smoke-tested. When publishing, those build jobs check out refs/tags/v<version> -- a
# protected tag -- never the ref a manual run was started from or any other ref.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      git_tag:
        required: true
        type: string
      promote_latest:
        required: false
        type: boolean
        default: false
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Staged Maven version to release as Docker images
        required: true
        type: string
      git_tag:
        description: Git ref for dry run, or GitHub release tag for publishing
        required: true
        type: string
      promote_latest:
        description: Allow manual dispatch to move latest-jvm/latest-native for a final release
        required: false
        type: boolean
        default: false
      dry_run:
        description: Build and validate without pushing DockerHub images or uploading the compose zip
        required: false
        type: boolean
        default: true
      maven_staging_confirmed:
        description: Required for manual publishing; confirms Maven staging was closed by release.yml
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-docker-${{ inputs.git_tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: bloxbean/yano
  JVM_BASE_IMAGE: eclipse-temurin:25-jre

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      is_final: ${{ steps.validate.outputs.is_final }}
      promote_latest: ${{ steps.validate.outputs.promote_latest }}
      dry_run: ${{ steps.validate.outputs.dry_run }}
      checkout_ref: ${{ steps.validate.outputs.checkout_ref }}
    steps:
      - name: Validate release inputs
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_GIT_TAG: ${{ inputs.git_tag }}
          INPUT_PROMOTE_LATEST: ${{ inputs.promote_latest || false }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || false }}
          INPUT_MAVEN_STAGING_CONFIRMED: ${{ inputs.maven_staging_confirmed || false }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          DRY_RUN="$INPUT_DRY_RUN"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" && "$INPUT_MAVEN_STAGING_CONFIRMED" != "true" ]]; then
            echo "Manual Docker publishing requires maven_staging_confirmed=true" >&2
            exit 1
          fi

          VERSION="$INPUT_VERSION"
          GIT_TAG="$INPUT_GIT_TAG"
          if [[ "$DRY_RUN" != "true" && "$VERSION" == *-SNAPSHOT* ]]; then
            echo "Docker releases require a non-SNAPSHOT version. Got: $VERSION" >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Version is not safe for Docker tags: $VERSION" >&2
            exit 1
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            CHECKOUT_REF="$GIT_TAG"
          else
            if [[ "$GIT_TAG" != "v${VERSION}" ]]; then
              echo "Git tag ${GIT_TAG} does not match version ${VERSION}" >&2
              exit 1
            fi
            # Publishing builds only from the release tag, which only the release App and org admins can
            # create. The fully qualified ref can't resolve to a branch with the same name.
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GIT_TAG}" --silent; then
              echo "Tag ${GIT_TAG} does not exist" >&2
              exit 1
            fi
            CHECKOUT_REF="refs/tags/${GIT_TAG}"
          fi

          IS_FINAL=false
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_FINAL=true
          fi
          PROMOTE_LATEST="$IS_FINAL"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PROMOTE_LATEST=false
            if [[ "$INPUT_PROMOTE_LATEST" == "true" ]]; then
              PROMOTE_LATEST="$IS_FINAL"
            fi
          fi

          {
            echo "version=$VERSION"
            echo "is_final=$IS_FINAL"
            echo "promote_latest=$PROMOTE_LATEST"
            echo "dry_run=$DRY_RUN"
            echo "checkout_ref=$CHECKOUT_REF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check the Gradle version at the ref
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          CHECKOUT_REF: ${{ steps.validate.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          GRADLE_VERSION=$(./gradlew -q properties | awk '/^version:/ { print $2; exit }')
          if [[ "$GRADLE_VERSION" != "$VERSION" ]]; then
            echo "Gradle version ${GRADLE_VERSION} at ${CHECKOUT_REF} does not match requested Docker version ${VERSION}" >&2
            exit 1
          fi

  # Build and smoke-test jobs: repository code, no credentials, no environment. No build cache either:
  # these jobs build what the push jobs publish.
  jvm-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Validate JVM base image
        run: docker buildx imagetools inspect "${JVM_BASE_IMAGE}" >/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Smoke test packaged JVM plugin catalog
        run: ./gradlew :app:packagedJvmPluginCatalogSmoke -PskipSigning=true

      - name: Prepare JVM Docker context
        run: ./gradlew :app:prepareYanoDockerJvmContext -PskipSigning=true

      - name: Build local JVM smoke image
        run: docker build --build-arg JVM_BASE_IMAGE="${JVM_BASE_IMAGE}" -t yano:jvm-smoke app/build/docker/jvm/context

      - name: Smoke test JVM image
        shell: bash
        run: |
          set -euo pipefail
          CID="$(docker run -d -e YANO_AUTO_SYNC_START=false -e YANO_PROFILE=preprod yano:jvm-smoke)"
          cleanup() {
            docker logs "$CID" --tail 200 || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if docker exec "$CID" curl -fsS http://localhost:7070/q/health/ready >/dev/null 2>&1; then
              docker exec "$CID" curl -fsS http://localhost:7070/q/health >/dev/null
              exit 0
            fi
            if ! docker ps -q --no-trunc | grep -q "$CID"; then
              echo "JVM container exited before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done

          echo "JVM container did not become healthy" >&2
          exit 1

      # A tarball keeps file modes (entrypoint, launch scripts); artifact uploads drop them.
      - name: Package JVM Docker context
        if: needs.validate.outputs.dry_run != 'true'
        run: tar -C app/build/docker/jvm -cf "$RUNNER_TEMP/docker-jvm-context.tar" context

      - name: Upload JVM Docker context
        if: needs.validate.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-jvm-context
          path: ${{ runner.temp }}/docker-jvm-context.tar
          if-no-files-found: error
          retention-days: 1

      - name: Dry-run JVM publish summary
        if: needs.validate.outputs.dry_run == 'true'
        env:
          YANO_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          echo "Dry run: would publish ${IMAGE_NAME}:${YANO_VERSION}-jvm"

  native-image:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Oracle GraalVM 25.3
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          version: '25.3'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Oracle GraalVM release
        run: native-image --version | grep -F 'Oracle GraalVM 25.3'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare native Docker context
        run: ./gradlew :app:prepareYanoDockerNativeContext -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false -PskipSigning=true

      - name: Verify native image uses G1
        run: grep -F '"garbage_collector":"G1 GC"' app/build/yano-native-image-source-jar/yano-build-output-stats.json

      - name: Smoke test native plugin catalog
        run: ./gradlew :app:nativePluginCatalogSmoke -PskipSigning=true

      - name: Build local native smoke image
        run: docker build -t yano:native-smoke app/build/docker/native/context

      - name: Smoke test native image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint ldd yano:native-smoke /app/yano

          CID="$(docker run -d -e YANO_AUTO_SYNC_START=false -e YANO_PROFILE=preprod yano:native-smoke)"
          cleanup() {
            docker logs "$CID" --tail 200 || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if docker exec "$CID" curl -fsS http://localhost:7070/q/health/ready >/dev/null 2>&1; then
              docker exec "$CID" curl -fsS http://localhost:7070/q/health >/dev/null
              exit 0
            fi
            if ! docker ps -q --no-trunc | grep -q "$CID"; then
              echo "Native container exited before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done

          echo "Native container did not become healthy" >&2
          exit 1

      # A tarball keeps file modes (the native binary, entrypoint); artifact uploads drop them.
      - name: Package native Docker context
        if: needs.validate.outputs.dry_run != 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: tar -C app/build/docker/native -cf "$RUNNER_TEMP/docker-native-context-${ARCH}.tar" context

      - name: Upload native Docker context
        if: needs.validate.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-native-context-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-native-context-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

      - name: Dry-run native publish summary
        if: needs.validate.outputs.dry_run == 'true'
        env:
          YANO_VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "Dry run: would publish ${IMAGE_NAME}:${YANO_VERSION}-native-${ARCH}"
          echo "Dry run: would create ${IMAGE_NAME}:${YANO_VERSION}-native"

  # Push jobs: Docker Hub credentials from release-staging; no checkout, no repository code beyond the
  # Dockerfiles in the downloaded contexts.
  push-jvm:
    needs: [validate, jvm-image]
    if: needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      contents: read
    steps:
      - name: Download JVM Docker context
        uses: actions/download-artifact@v4
        with:
          name: docker-jvm-context
          path: ${{ runner.temp }}

      - name: Unpack JVM Docker context
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/docker-jvm-context.tar"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish JVM image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ runner.temp }}/context
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JVM_BASE_IMAGE=${{ env.JVM_BASE_IMAGE }}
          tags: ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}-jvm

  push-native:
    needs: [validate, native-image]
    if: needs.validate.outputs.dry_run != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release-staging
    permissions:
      contents: read
    steps:
      - name: Download native Docker context
        uses: actions/download-artifact@v4
        with:
          name: docker-native-context-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Unpack native Docker context
        env:
          ARCH: ${{ matrix.arch }}
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/docker-native-context-${ARCH}.tar"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish native image for ${{ matrix.arch }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ runner.temp }}/context
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}-native-${{ matrix.arch }}

  native-manifest:
    needs: [validate, push-native]
    if: needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish native multi-arch manifest
        shell: bash
        env:
          YANO_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${YANO_VERSION}-native" \
            "${IMAGE_NAME}:${YANO_VERSION}-native-amd64" \
            "${IMAGE_NAME}:${YANO_VERSION}-native-arm64"

  promote-latest:
    needs: [validate, push-jvm, native-manifest]
    if: needs.validate.outputs.promote_latest == 'true' && needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote latest Docker tags
        shell: bash
        env:
          YANO_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            -t "${IMAGE_NAME}:latest-jvm" \
            "${IMAGE_NAME}:${YANO_VERSION}-jvm"
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:latest-native" \
            "${IMAGE_NAME}:${YANO_VERSION}-native"

  # Manual dry runs started on main or release/** also prove that the release-staging Docker Hub
  # credentials work: log in and out, nothing else. No checkout, nothing is pushed.
  verify-docker-login:
    needs: validate
    if: >-
      needs.validate.outputs.dry_run == 'true' && github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    environment: release-staging
    permissions: {}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-compose-zip:
    # Dry runs: after the image builds. Publishing: after the images are pushed (and latest promoted, for a
    # final release).
    needs: [validate, jvm-image, native-image, push-jvm, native-manifest, promote-latest]
    if: >-
      !cancelled()
      && needs.jvm-image.result == 'success'
      && needs.native-image.result == 'success'
      && (needs.validate.outputs.dry_run == 'true'
          || (needs.push-jvm.result == 'success'
              && needs.native-manifest.result == 'success'
              && needs.promote-latest.result != 'failure'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Docker compose zip
        shell: bash
        env:
          YANO_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          ./gradlew :app:yanoDockerDistZip \
            -PyanoDockerReleaseVersion="$YANO_VERSION" \
            -PyanoDockerImageTag="$YANO_VERSION" \
            -PskipSigning=true

      - name: Validate compose zip
        shell: bash
        env:
          YANO_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          TMP_DIR="$(mktemp -d)"
          unzip -q "app/build/distributions/yano-docker-${YANO_VERSION}.zip" -d "$TMP_DIR"
          docker compose \
            -f "$TMP_DIR/yano-docker-${YANO_VERSION}/compose/yano.yml" \
            --env-file "$TMP_DIR/yano-docker-${YANO_VERSION}/compose/.env" \
            config >/dev/null

      - name: Upload compose zip
        if: needs.validate.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-zip
          path: app/build/distributions/yano-docker-*.zip
          if-no-files-found: error
          retention-days: 1

  # The only job with a write token; it runs no repository code.
  attach-compose-zip:
    needs: [validate, docker-compose-zip]
    # Preview releases skip promote-latest upstream. Override the implicit
    # success() check, but require a successfully validated and built ZIP.
    if: >-
      !cancelled()
      && needs.validate.result == 'success'
      && needs.docker-compose-zip.result == 'success'
      && needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compose zip
        uses: actions/download-artifact@v4
        with:
          name: docker-compose-zip
          path: dist

      - name: Upload compose zip to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.git_tag }}
          files: dist/yano-docker-*.zip
          prerelease: ${{ needs.validate.outputs.is_final != 'true' }}
          make_latest: legacy
          overwrite_files: true
          fail_on_unmatched_files: true
