name: Node-Diversity Reports

# ADR-060: Yano's reports for the Cardano node-diversity conformance site
# (https://pragma-org.github.io/node-diversity-conformance/). Fetches the pinned corpora
# (ledger-conformance/node-diversity/corpora.env), writes yano-<version>-<yyyymmdd>-<scenario>.json with
# :ledger-conformance:nodeDiversityReports, scores them with the site's own builder (job summary) and uploads them as
# artifact node-diversity-reports. release-dist.yml calls it on release tags and attaches the reports to the GitHub
# release, where the site's github_releases lookup finds them. Dispatch it on any branch to check the scores first.
# A score below 100% never fails the run; a harness failure does. Pull requests that change the harness run it too.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/node-diversity-reports.yml'
      - 'ledger-conformance/node-diversity/**'
      - 'ledger-conformance/src/test/java/org/yanoproject/ledger/conformance/diversity/**'

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fetch the pinned corpora
        run: ledger-conformance/node-diversity/fetch-corpora.sh "$RUNNER_TEMP/corpora"

      - name: Generate the reports
        run: |
          chmod +x gradlew
          ./gradlew :ledger-conformance:nodeDiversityReports -PnodeDiversityCorpora="$RUNNER_TEMP/corpora" \
            -PskipSigning=true --stacktrace

      - name: Score the reports
        run: |
          {
            echo '### Node-diversity scores'
            echo '```'
            ledger-conformance/node-diversity/score-reports.sh ledger-conformance/build/node-diversity \
              "$RUNNER_TEMP/corpora/node-diversity-conformance"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the reports
        uses: actions/upload-artifact@v4
        with:
          name: node-diversity-reports
          path: ledger-conformance/build/node-diversity/yano-*.json
          if-no-files-found: error
