name: Dev Distribution Build

# Manual only. A dev-* tag trigger was removed: anyone with write access can create such tags.
# bloxbean-snapshot-dist.yml calls it to build the zips it publishes. Every distribution is built by default; untick
# the slow native platforms that are not needed.
on:
  workflow_dispatch:
    inputs:
      jar-dist:
        description: JVM (uber-jar) distribution
        type: boolean
        default: true
      linux-x64:
        description: Native linux-x64
        type: boolean
        default: true
      linux-arm64:
        description: Native linux-arm64
        type: boolean
        default: true
      macos-arm64:
        description: Native macos-arm64
        type: boolean
        default: true
      windows-x64:
        description: Native windows-x64
        type: boolean
        default: true
  workflow_call:
    inputs:
      jar-dist:
        description: JVM (uber-jar) distribution
        type: boolean
        default: true
      linux-x64:
        description: Native linux-x64
        type: boolean
        default: true
      linux-arm64:
        description: Native linux-arm64
        type: boolean
        default: true
      macos-arm64:
        description: Native macos-arm64
        type: boolean
        default: true
      windows-x64:
        description: Native windows-x64
        type: boolean
        default: true
    outputs:
      jar-dist:
        description: Whether the JVM zip was built
        value: ${{ jobs.plan.outputs.jar-dist }}
      platforms:
        description: Space-separated labels of the native zips built
        value: ${{ jobs.plan.outputs.platforms }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jar-dist: ${{ inputs.jar-dist }}
      native: ${{ steps.plan.outputs.native }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - name: Select the distributions
        id: plan
        shell: bash
        env:
          JAR_DIST: ${{ inputs.jar-dist }}
          CHOICES: >-
            [{"os": "ubuntu-22.04", "label": "linux-x64", "selected": ${{ inputs.linux-x64 }}},
             {"os": "ubuntu-22.04-arm", "label": "linux-arm64", "selected": ${{ inputs.linux-arm64 }}},
             {"os": "macos-15", "label": "macos-arm64", "selected": ${{ inputs.macos-arm64 }}},
             {"os": "windows-latest", "label": "windows-x64", "selected": ${{ inputs.windows-x64 }}}]
        run: |
          set -euo pipefail
          native=$(jq -c 'map(select(.selected) | del(.selected))' <<< "$CHOICES")
          if [[ "$JAR_DIST" != true && "$native" == '[]' ]]; then
            echo "::error::Select at least one distribution." >&2
            exit 1
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "platforms=$(jq -r 'map(.label) | join(" ")' <<< "$native")" >> "$GITHUB_OUTPUT"

  jar-dist:
    if: inputs.jar-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build uber-jar distribution
        run: ./gradlew :app:yanoDistZip -PskipSigning=true
      - name: Smoke test packaged JVM plugin catalog
        run: ./gradlew :app:packagedJvmPluginCatalogSmoke -PskipSigning=true
      - name: Upload JAR distribution
        uses: actions/upload-artifact@v4
        with:
          name: jar-dist
          path: app/build/distributions/yano-*.zip
          retention-days: 3

  native-dist:
    needs: plan
    if: needs.plan.outputs.native != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.native) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Oracle GraalVM 25.3
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          version: '25.3'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Oracle GraalVM release
        if: runner.os != 'Windows'
        shell: bash
        run: native-image --version | grep -F 'Oracle GraalVM 25.3'
      - name: Verify Oracle GraalVM release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nativeImageVersion = native-image --version 2>&1 | Out-String
          if ($nativeImageVersion -notmatch 'Oracle GraalVM 25\.3') {
            throw "Expected Oracle GraalVM 25.3, got: $nativeImageVersion"
          }
          Write-Output $nativeImageVersion
      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Build native binary
        if: runner.os != 'Windows'
        run: ./gradlew :app:quarkusBuild -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false -PskipSigning=true
      - name: Build native binary on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:quarkusBuild "-Dquarkus.native.enabled=true" "-Dquarkus.package.jar.enabled=false" "-PskipSigning=true"
      - name: Verify native image uses G1
        if: runner.os != 'Windows'
        shell: bash
        run: grep -F '"garbage_collector":"G1 GC"' app/build/yano-native-image-source-jar/yano-build-output-stats.json
      - name: Package native distribution
        if: runner.os != 'Windows'
        run: ./gradlew :app:yanoNativeDistZip -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false -PskipSigning=true
      - name: Package native distribution on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:yanoNativeDistZip "-Dquarkus.native.enabled=true" "-Dquarkus.package.jar.enabled=false" "-PskipSigning=true"
      - name: Smoke test packaged native plugin catalog
        if: runner.os != 'Windows'
        run: ./gradlew :app:nativePluginCatalogSmoke -PskipSigning=true
      - name: Smoke test packaged native plugin catalog on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:nativePluginCatalogSmoke "-PskipSigning=true"
      - name: Upload native distribution
        uses: actions/upload-artifact@v4
        with:
          name: native-dist-${{ matrix.label }}
          path: app/build/distributions/yano-native-*.zip
          retention-days: 3
