name: Publish snapshot to the BloxBean Maven repository

# Publishes the commit's Maven publications to the BloxBean Maven repository on Cloudflare R2, which consumers
# read anonymously at https://repo.bloxbean.org/maven/snapshots. See
# adr/059-r2-maven-repository-for-development-artifacts.md. Independent of snapshot_manual.yml (Central Portal
# snapshots) and of the release workflows; it publishes no distribution, image or npm package.
#
# Gradle only publishes to a local directory, through the `stagingRepository` hook in build.gradle; it knows nothing
# about the storage. .github/scripts/bloxbean-maven.sh, shared with release.yml, owns the transfer: it seeds each
# artifact's maven-metadata.xml from the bucket so that Gradle appends the new version instead of replacing the
# version list, uploads the checked tree with the AWS CLI, and verifies the result through the public URL with a
# real Gradle consumer. It never deletes and never writes outside maven/snapshots/org/yanoproject/, which other
# BloxBean projects share a bucket with.

on:
  workflow_dispatch:

permissions:
  contents: read
  # Reads the commit's CI runs (require-green-ci.sh).
  actions: read

# Seed, publish and upload are a read-modify-write of every artifact's maven-metadata.xml: two concurrent runs
# would each drop the other's version from the list. Never cancel a run that may be uploading.
concurrency:
  group: bloxbean-maven-snapshots
  cancel-in-progress: false

jobs:
  publish:
    # The bucket credentials are secrets of this environment, which only accepts main, release/** and v* tags.
    # Skip other branches rather than fail on the environment's branch policy.
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    environment: release-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GROUP_PATH: org/yanoproject
      BUCKET: ${{ vars.R2_BUCKET }}
      REPOSITORY_PREFIX: maven/snapshots
      PUBLIC_REPOSITORY_URL: https://repo.bloxbean.org/maven/snapshots
      # What the Gradle consumer check resolves, and which of this build's jars it must get.
      CONSUMER_PLATFORM: org.yanoproject:yano-bom
      CONSUMER_DEPENDENCIES: org.yanoproject:yano
      CONSUMER_REQUIRED: yano-core-api yano-runtime
      # Absolute, because build.gradle resolves stagingRepository against each project's own directory.
      STAGING_DIR: ${{ github.workspace }}/build/bloxbean-maven
      AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      # AWS CLI 2.23+ sends request checksums R2 does not accept by default; send them only when an API needs one.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Publish only a commit whose push CI passed, rather than repeat ~40 minutes of the same tests here.
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOWS: build.yml integration.yml
        run: bash .github/scripts/require-green-ci.sh
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Only -SNAPSHOT versions belong in the snapshot repository. build.gradle inserts the short commit id, so
      # each commit publishes its own version, e.g. 0.1.0-pre18-1a2b3c4-SNAPSHOT.
      - name: Resolve the snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties -PskipSigning=true | awk '/^version:/ { print $2; exit }')
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Snapshot publishing requires a -SNAPSHOT version. Got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"


      - name: Discover the Maven publications
        id: discover
        run: bash .github/scripts/bloxbean-maven.sh discover -PskipSigning=true

      - name: Seed metadata from the repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ARTIFACTS: ${{ steps.discover.outputs.artifacts }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/bloxbean-maven.sh seed

      - name: Stage the Maven publications
        run: >-
          ./gradlew publishAllPublicationsToStagingRepository
          -PstagingRepository="$STAGING_DIR" -PskipSigning=true --stacktrace

      - name: Verify the staged repository
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACTS: ${{ steps.discover.outputs.artifacts }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one argument per artifactId
          python3 .github/scripts/verify-maven-staging.py "$STAGING_DIR" "$RUNNER_TEMP/maven-seed" "$GROUP_PATH" \
            "$VERSION" $ARTIFACTS

      - name: Upload to the repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash .github/scripts/bloxbean-maven.sh upload

      - name: Verify the public repository
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACTS: ${{ steps.discover.outputs.artifacts }}
        run: bash .github/scripts/bloxbean-maven.sh verify-public

      - name: Resolve with a Gradle consumer
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACTS: ${{ steps.discover.outputs.artifacts }}
        run: bash .github/scripts/bloxbean-maven.sh consume

      - name: Record the publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACTS: ${{ steps.discover.outputs.artifacts }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Published \`$VERSION\` to the BloxBean Maven repository"
            echo
            echo "$(wc -w <<< "$ARTIFACTS") artifacts under $PUBLIC_REPOSITORY_URL/$GROUP_PATH/"
            echo
            echo '```groovy'
            echo 'repositories {'
            echo '    mavenCentral()'
            echo '    maven {'
            echo "        url = uri('$PUBLIC_REPOSITORY_URL')"
            echo '        mavenContent { snapshotsOnly() }'
            echo '    }'
            echo '}'
            echo 'dependencies {'
            echo "    implementation 'org.yanoproject:yano:$VERSION'"
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Updates the "Development snapshot" pre-release (tag `snapshot`) on the Releases page, so users find the newest
  # snapshot. Its own job: the only one with a write token, and it never sees the bucket credentials.
  github-snapshot:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update the Development snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          MAVEN_METADATA_URL: https://repo.bloxbean.org/maven/snapshots/org/yanoproject/yano/maven-metadata.xml
          MAVEN_COORDINATE: org.yanoproject:yano
          MAVEN_REPOSITORY_URL: https://repo.bloxbean.org/maven/snapshots
          DIST_LATEST_URL: https://repo.bloxbean.org/dist/snapshots/yano/latest.json
        run: bash .github/scripts/update-snapshot-release.sh
