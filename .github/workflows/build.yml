name: Clean, Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - develop*
      - release**
      - next
  pull_request:
    branches:
      - main
      - develop
      - develop*
      - release**
      - next

# PR builds run the pull request's own code: give it a read-only token.
permissions:
  contents: read

jobs:
  commit-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Test consumer input staging script
        run: bash .github/scripts/tests/stage-consumer-inputs-test.sh
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build -PskipSigning=true --stacktrace
      # ADR-064 D8: the org.yanoproject.app.spi gate. Stages every publication to an isolated file
      # repository and boots a downstream Quarkus application composed from it.
      - name: Downstream-consumer check of yano-app-core
        run: >-
          ./gradlew :app:appCoreConsumerCheck -PskipSigning=true --stacktrace
          "-PstagingRepository=file://$RUNNER_TEMP/yano-consumer-check-staging"
      # Fails the PR, not release day, when a module starts or stops publishing without the Central
      # deployment scope in build.gradle following it.
      - name: Verify Maven Central publication scope
        run: ./gradlew verifyMavenReleasePublicationScope -PskipSigning=true --stacktrace
