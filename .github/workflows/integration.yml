name: Integration, Distribution, Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - develop*
      - release*
      - next
  pull_request:
    branches:
      - main
      - develop
      - develop*
      - release*
      - next

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run retained integration tests
        run: ./gradlew extendedTest -PskipSigning=true --stacktrace

  distribution-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify core JVM distribution
        run: ./gradlew distributionCheck -PskipSigning=true --stacktrace

  native-core:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Set up Oracle GraalVM 25.3
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
      - name: Verify Oracle GraalVM release
        run: native-image --version | grep -F 'Oracle GraalVM 25.3'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build, verify, and smoke-test the native core distribution
        run: >-
          ./gradlew
          :app:verifyCoreNativeDistribution
          :app:nativePluginCatalogSmoke
          -Dquarkus.native.enabled=true
          -Dquarkus.package.jar.enabled=false
          -PskipSigning=true
          --stacktrace
      - name: Verify native image uses G1
        run: grep -F '"garbage_collector":"G1 GC"' app/build/yano-native-image-source-jar/yano-build-output-stats.json
