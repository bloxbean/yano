# From the release-ops standard (templates/workflows/release.yml, 2026-09-14), adapted for Yano: no release
# assets and no `github-release` job here (release-dist.yml owns the GitHub release, the distribution zips and
# npm), plus the Docker release gated by docker_publish.
name: Stage release to Maven Central

# A v* tag, created by tag-release.yml after a code-owner-approved version bump merges, builds and signs
# every module and uploads a USER_MANAGED Central Portal deployment. It stops there: nothing is on Maven
# Central until a human publishes the deployment, via publish-central.yml or the portal.
#
# Release side effects are gated by flags in gradle.properties: docker_publish (this workflow, after the
# deployment is staged), npm_publish and github_release (release-dist.yml, which runs on the same tag).

on:
  push:
    tags:
      - 'v*'

permissions: {}

# Never cancel a run that may already have uploaded a deployment.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The signing subkey and Central Portal token are secrets of this environment, which only accepts
    # v* tags (plus the default branch and release/** for the other release workflows). Only the release
    # App and org admins can create v* tags.
    environment: release-staging
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_final: ${{ steps.version.outputs.is_final }}
      docker_publish: ${{ steps.version.outputs.docker_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate tag and read release flags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # gradle.properties uses `key = value`; reading it through Gradle tolerates the spaces.
          PROPS=$(./gradlew -q properties)
          VERSION=$(awk '/^version:/ { print $2; exit }' <<< "$PROPS")
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Git tag ${GITHUB_REF_NAME} does not match Gradle version ${VERSION}" >&2
            exit 1
          fi
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Release tags require a non-SNAPSHOT version. Got: $VERSION" >&2
            exit 1
          fi
          IS_FINAL=false
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_FINAL=true
          fi
          # A Docker image is public the moment it is pushed and can never be replaced under the same
          # tag, so it is opt-in per release rather than an automatic consequence of tagging.
          DOCKER_PUBLISH=$(awk '/^docker_publish:/ { print $2; exit }' <<< "$PROPS")
          # Read here only for the summary; release-dist.yml acts on them.
          NPM_PUBLISH=$(awk '/^npm_publish:/ { print $2; exit }' <<< "$PROPS")
          GITHUB_RELEASE=$(awk '/^github_release:/ { print $2; exit }' <<< "$PROPS")
          {
            echo "version=$VERSION"
            echo "is_final=$IS_FINAL"
            echo "docker_publish=${DOCKER_PUBLISH:-false}"
            echo "npm_publish=${NPM_PUBLISH:-false}"
            echo "github_release=${GITHUB_RELEASE:-false}"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (final: $IS_FINAL), Docker: ${DOCKER_PUBLISH:-false}," \
            "npm: ${NPM_PUBLISH:-false}, GitHub release: ${GITHUB_RELEASE:-false}"

      - name: Build with Gradle
        run: ./gradlew clean fullBuild --stacktrace

      # Uploads a USER_MANAGED deployment and waits for Sonatype validation. It stops there: nothing is
      # on Maven Central until a human publishes it. See nmcpAggregation in build.gradle.
      - name: Upload deployment to Maven Central staging
        id: upload
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          # Signing subkey passed to Gradle in memory (see configureReleaseSigning in build.gradle):
          # nothing is written to disk and nothing appears on the command line.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY_ASC }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not add --warn here. It lowers Gradle below LIFECYCLE, which is the level nmcp reports the
          # deployment id at, and the grep below would then fail every release after a successful upload.
          ./gradlew publishAggregationToCentralPortal --stacktrace 2>&1 | tee upload.log
          # The deployment id exists only in nmcp's output. Fail loudly if the log format changes rather
          # than reporting a release with no id.
          id=$(grep -oE "deployment bundle '[0-9a-f-]{36}'" upload.log \
            | head -1 | grep -oE '[0-9a-f-]{36}' || true)
          if [[ -z "$id" ]]; then
            echo "::error::Upload succeeded but no deployment id was found in the log." >&2
            exit 1
          fi
          echo "deployment-id=$id" >> "$GITHUB_OUTPUT"

      - name: Record the pending deployment
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment-id }}
          VERSION: ${{ steps.version.outputs.version }}
          DOCKER_PUBLISH: ${{ steps.version.outputs.docker_publish }}
          NPM_PUBLISH: ${{ steps.version.outputs.npm_publish }}
          GITHUB_RELEASE: ${{ steps.version.outputs.github_release }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Maven Central deployment staged - NOT published"
            echo
            echo "Deployment \`$DEPLOYMENT_ID\` (\`yano:$VERSION\`) passed validation"
            echo "and is waiting for a human."
            echo
            echo "Publish it through the approval-gated workflow:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/publish-central.yml"
            echo
            echo "Or from the portal: https://central.sonatype.com/publishing/deployments"
            echo
            echo "Release side effects of this tag, which do not wait for the Central deployment:"
            echo "- Docker images (docker_publish, next job): $DOCKER_PUBLISH"
            echo "- npm packages (npm_publish, release-dist.yml): $NPM_PUBLISH"
            echo "- GitHub release (github_release, release-dist.yml): $GITHUB_RELEASE"
            if [[ "$DOCKER_PUBLISH$NPM_PUBLISH$GITHUB_RELEASE" != *true* ]]; then
              echo
              echo "Nothing public for this tag. If this was a rehearsal, drop the deployment in the portal."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  docker-release:
    needs: publish
    # Gated by docker_publish in gradle.properties. Unlike the Central deployment, which is staged and waits
    # for a human, a pushed image is immediately public and permanent.
    if: needs.publish.outputs.docker_publish == 'true'
    # The called workflow's docker-compose-zip upload attaches to the GitHub release.
    permissions:
      contents: write
    uses: ./.github/workflows/release-docker.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      git_tag: ${{ github.ref_name }}
    # The Docker Hub credentials are secrets of the release-staging environment, named by the called
    # workflow's push jobs. GitHub documents that such a job uses the environment secret, not one passed by
    # the caller; `inherit` keeps to that documented path. Once migrated the repository has no
    # repository-level secrets and sees no org release secrets, so nothing else reaches the called workflow.
    secrets: inherit
