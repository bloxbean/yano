<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-label="ADR-039 delegation flow from app login to a verified write"><title>ADR-039 delegation flow from app login to a verified write</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker></defs><rect x="0" y="0" width="1180" height="640" fill="#ffffff"/><text x="20" y="30" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2533" text-anchor="start">Delegation: owner → issuer → session key → message</text><text x="20" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6478" text-anchor="start">The issuer key never leaves the application; the session key never leaves the device; members check the whole chain on every write.</text><rect x="10" y="70" width="220" height="40" rx="8" fill="#eaf2ff" stroke="#3b6fd8" stroke-width="1.4"/><text x="120.0" y="89.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3b6fd8" text-anchor="middle">User device</text><line x1="120" y1="110" x2="120" y2="620" stroke="#c9ced8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="290" y="70" width="220" height="40" rx="8" fill="#eaf2ff" stroke="#3b6fd8" stroke-width="1.4"/><text x="400.0" y="89.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3b6fd8" text-anchor="middle">Application (issuer key)</text><line x1="400" y1="110" x2="400" y2="620" stroke="#c9ced8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="580" y="70" width="220" height="40" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="690.0" y="89.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="middle">Any member</text><line x1="690" y1="110" x2="690" y2="620" stroke="#c9ced8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="870" y="70" width="220" height="40" rx="8" fill="#eaf7ef" stroke="#2e8b57" stroke-width="1.4"/><text x="980.0" y="89.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2e8b57" text-anchor="middle">Registry state</text><line x1="980" y1="110" x2="980" y2="620" stroke="#c9ced8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="870" y="128" width="220" height="70" rx="8" fill="#eaf7ef" stroke="#2e8b57" stroke-width="1.4"/><text x="880" y="147.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2e8b57" text-anchor="start">0 · set earlier by the owners</text><text x="880" y="164.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">policy of games/neon-rush/:</text><text x="880" y="179.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">writers and delegate = [issuer]</text><circle cx="30" cy="150" r="10" fill="#3b6fd8"/><text x="30" y="154" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><path d="M 120 150 L 400 150" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="260" y="137.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">sign in (app login, wallet, OAuth, …)</text><circle cx="30" cy="190" r="10" fill="#3b6fd8"/><text x="30" y="194" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="48" y="172" width="190" height="40" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="58" y="191.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">create session key</text><text x="58" y="208.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">Ed25519, in WebCrypto</text><path d="M 238 200 L 400 200" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="318" y="187.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">public key of the session</text><circle cx="30" cy="250" r="10" fill="#3b6fd8"/><text x="30" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="300" y="230" width="200" height="56" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="310" y="249.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">sign delegation</text><text x="310" y="266.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">delegate, scope</text><text x="310" y="281.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">games/neon-rush/, 1 h window</text><path d="M 300 270 L 120 270" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="210" y="257.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">delegation</text><circle cx="30" cy="320" r="10" fill="#3b6fd8"/><text x="30" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><rect x="48" y="296" width="190" height="68" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="58" y="315.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">sign each write</text><text x="58" y="332.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">write-statement with the</text><text x="58" y="347.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">session key; build the</text><text x="58" y="362.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">frame</text><path d="M 238 330 L 690 330" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="464" y="317.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">POST /messages {topic, body = frame}</text><circle cx="30" cy="400" r="10" fill="#3b6fd8"/><text x="30" y="404" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><rect x="590" y="370" width="200" height="108" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="600" y="389.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">verify</text><text x="600" y="406.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">issuer ∈ policy.delegate ·</text><text x="600" y="421.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">scope covers topic · window</text><text x="600" y="436.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">on block time · not revoked ·</text><text x="600" y="451.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">session signature · statement</text><text x="600" y="466.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">unused</text><path d="M 790 395 L 980 395" fill="none" stroke="#4a5368" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><text x="885" y="382.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">policy revision at height</text><path d="M 790 440 L 980 440" fill="none" stroke="#4a5368" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><text x="885" y="427.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">revoked / used lookups</text><circle cx="30" cy="520" r="10" fill="#3b6fd8"/><text x="30" y="524" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><path d="M 690 520 L 980 520" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="835" y="507.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">finalized: statement hash → used/</text><path d="M 690 545 L 120 545" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="405" y="532.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">202, then final in about a second</text><circle cx="30" cy="590" r="10" fill="#3b6fd8"/><text x="30" y="594" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><rect x="870" y="568" width="220" height="46" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="880" y="587.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">revoke early (optional)</text><text x="880" y="604.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">owner command → revoked/</text><path d="M 400 590 L 870 590" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="635" y="577.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">issuer or owners revoke a delegation</text></svg>
