<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" role="img" aria-label="ADR-039 registry lifecycle: commands, approval, activation and revisions"><title>ADR-039 registry lifecycle: commands, approval, activation and revisions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker></defs><rect x="0" y="0" width="1180" height="470" fill="#ffffff"/><text x="20" y="30" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2533" text-anchor="start">How a registry change happens</text><text x="20" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6478" text-anchor="start">Every change is a signed chain transaction that takes effect later, never retroactively; old revisions are kept so old messages stay verifiable.</text><rect x="20" y="80" width="300" height="110" rx="8" fill="#eaf2ff" stroke="#3b6fd8" stroke-width="1.4"/><text x="30" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3b6fd8" text-anchor="start">Owner command on ~topics/registry</text><text x="30" y="116.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">a command statement bound to the generation,</text><text x="30" y="131.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">naming the head revision it expects; signed</text><text x="30" y="146.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">k-of-n by the entry's or an ancestor's owners</text><text x="30" y="161.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">(registrars for top level); any member relays</text><text x="30" y="176.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">it</text><rect x="20" y="210" width="300" height="110" rx="8" fill="#f3ecff" stroke="#7b4bc4" stroke-width="1.4"/><text x="30" y="229.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#7b4bc4" text-anchor="start">Governance command on ~governance/topics</text><text x="30" y="246.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">threshold-many members submit the identical</text><text x="30" y="261.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">command within the approval window</text><text x="30" y="276.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">(ADR-008.3)</text><rect x="390" y="140" width="220" height="120" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="400" y="159.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">Finalized at height h</text><text x="400" y="176.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">checks: generation, notAfter,</text><text x="400" y="191.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">expected head revision,</text><text x="400" y="206.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">signatures of the authority's</text><text x="400" y="221.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">active epoch, free name, limits;</text><text x="400" y="236.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">a failing command is a no-op</text><text x="400" y="251.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">with a receipt</text><rect x="680" y="140" width="220" height="120" rx="8" fill="#eaf7ef" stroke="#2e8b57" stroke-width="1.4"/><text x="690" y="159.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2e8b57" text-anchor="start">Active at h + lag</text><text x="690" y="176.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">lag ≥ 1 (default 10); applies</text><text x="690" y="191.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">only if the authority's active</text><text x="690" y="206.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">epoch is unchanged, else</text><text x="690" y="221.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">TOPIC_COMMAND_SUPERSEDED</text><rect x="960" y="80" width="200" height="110" rx="8" fill="#eaf7ef" stroke="#2e8b57" stroke-width="1.4"/><text x="970" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2e8b57" text-anchor="start">revision r+1</text><text x="970" y="116.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">entry/&lt;name&gt; now holds the</text><text x="970" y="131.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">new owners or policy</text><rect x="960" y="210" width="200" height="110" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="970" y="229.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">revision r</text><text x="970" y="246.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">moved to history/&lt;name&gt;/&lt;r&gt;;</text><text x="970" y="261.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">messages before h + lag are</text><text x="970" y="276.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">judged by it</text><path d="M 320 135 L 355 135 L 355 180 L 390 180" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 320 265 L 355 265 L 355 220 L 390 220" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 610 200 L 680 200" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 900 175 L 930 175 L 930 135 L 960 135" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 900 225 L 930 225 L 930 265 L 960 265" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="345" width="1140" height="110" rx="12" fill="none" stroke="#8a93a6" stroke-width="1.4" stroke-dasharray="7 5"/><text x="32" y="363" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8a93a6" text-anchor="start">Typical commands</text><text x="40" y="383" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2533" text-anchor="start">create namespace or topic · update policy (writers, delegate, schema, limits) · rotate owners (signed by current owners) · revoke delegation · retire entry · a replayed or conflicting command names a stale revision</text><text x="40" y="406" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2533" text-anchor="start">governance only: top-level create (governance mode) · replace owners (recovery) · change registrars · change chain topic config (enable, unregistered-topics, limits)</text><text x="40" y="429" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6478" text-anchor="start" font-style="italic">nothing deletes history: retired entries refuse new messages but stay readable and provable</text></svg>
