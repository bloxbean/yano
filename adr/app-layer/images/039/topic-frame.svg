<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-label="ADR-039 the body frame and what each signature covers"><title>ADR-039 the body frame and what each signature covers</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker></defs><rect x="0" y="0" width="1180" height="650" fill="#ffffff"/><text x="20" y="30" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2533" text-anchor="start">A message on a protected topic</text><text x="20" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6478" text-anchor="start">The envelope is unchanged and still signed by the relaying member. The client's proof travels inside the body, so messageId and existing message proofs cover it.</text><rect x="20" y="70" width="1140" height="565" rx="12" fill="none" stroke="#d98a1a" stroke-width="1.4" stroke-dasharray="7 5"/><text x="32" y="88" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d98a1a" text-anchor="start">AppMessage envelope v2 — unchanged: chainId, topic, sender (member), senderSeq, expiresAt, body, member authProof</text><rect x="40" y="108" width="1100" height="510" rx="12" fill="none" stroke="#2a7ab0" stroke-width="1.4" stroke-dasharray="7 5"/><text x="52" y="126" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2a7ab0" text-anchor="start">body = topic-frame (canonical CBOR, RFC 8949 §4.2.1)</text><rect x="60" y="150" width="180" height="64" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="150.0" y="169.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="middle">1</text><text x="150.0" y="186.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="middle">frame version</text><rect x="260" y="150" width="260" height="64" rx="8" fill="#ffffff" stroke="#5b6478" stroke-width="1.4"/><text x="270" y="169.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5b6478" text-anchor="start">payload : bstr</text><text x="270" y="186.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">the application's bytes; checked</text><text x="270" y="201.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">against the topic schema</text><rect x="540" y="140" width="580" height="228" rx="12" fill="none" stroke="#c0396b" stroke-width="1.4" stroke-dasharray="7 5"/><text x="552" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c0396b" text-anchor="start">writer-proof</text><rect x="560" y="172" width="130" height="56" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="570" y="191.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">nonce</text><text x="570" y="208.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">16 bytes</text><rect x="700" y="172" width="130" height="56" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="710" y="191.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">notAfter</text><text x="710" y="208.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">ms, block time</text><rect x="840" y="172" width="260" height="56" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="850" y="191.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">signatures</text><text x="850" y="208.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">[[key, sig], …] Ed25519, k-of-n</text><rect x="560" y="246" width="440" height="106" rx="8" fill="#eaf2ff" stroke="#3b6fd8" stroke-width="1.4"/><text x="570" y="265.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3b6fd8" text-anchor="start">delegation (optional)</text><text x="570" y="282.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">[1, delegate (session key), scope (topic or namespace/), notBefore,</text><text x="570" y="297.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">notAfter, issuer, sig] — the issuer signs "yano-topic-delegation-v1"</text><text x="570" y="312.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">‖ chainId ‖ fields</text><rect x="60" y="410" width="600" height="84" rx="8" fill="#eef6fb" stroke="#2a7ab0" stroke-width="1.4"/><text x="70" y="429.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2a7ab0" text-anchor="start">write-statement (signed, never sent)</text><text x="70" y="446.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">["yano-topic-write-v1", chainId, topic, BLAKE2b-256(payload), nonce, notAfter] — signed by a</text><text x="70" y="461.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">writer, or by the session key when delegated</text><rect x="680" y="410" width="440" height="196" rx="8" fill="#ffffff" stroke="#5b6478" stroke-width="1.4"/><text x="690" y="429.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5b6478" text-anchor="start">What members check</text><text x="690" y="446.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">1. the topic's policy at this block height</text><text x="690" y="461.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">2. canonical frame decode</text><text x="690" y="476.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">3. signatures over write-statement: threshold of writers, or one</text><text x="690" y="491.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">session key with a valid delegation from an allowed issuer</text><text x="690" y="506.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">4. delegation scope within the issuer's scope; window on block time;</text><text x="690" y="521.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">not revoked</text><text x="690" y="536.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">5. statement hash not used before (replay)</text><text x="690" y="551.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">6. payload size and schema</text><rect x="60" y="512" width="600" height="94" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="70" y="531.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">Why in the body</text><text x="70" y="548.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">no change to the envelope, its messageId or the yaci gossip codec; the proof is covered by</text><text x="70" y="563.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">messageId and by existing finalized-message proofs; machines receive the payload as the body</text><text x="70" y="578.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">(D7a)</text><path d="M 390 214 L 390 410" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="396" y="294.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="start">BLAKE2b-256</text><path d="M 1060 228 L 1060 385 L 600 385 L 600 410" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="830" y="394.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">signs the statement</text></svg>
