<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-label="ADR-039 the validation pipeline and where each check runs"><title>ADR-039 the validation pipeline and where each check runs</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker></defs><rect x="0" y="0" width="1180" height="560" fill="#ffffff"/><text x="20" y="30" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2533" text-anchor="start">One check function, run in three places</text><text x="20" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6478" text-anchor="start">TopicPolicy.check(message, parent state, block time, earlier messages in the block) — first failure wins. Only the follower check makes it a consensus rule.</text><rect x="20" y="80" width="150" height="96" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="30" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">1 Framework bounds</text><text x="30" y="116.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">size, topic rules</text><text x="30" y="131.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">(today)</text><path d="M 170 128 L 185 128" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="185" y="80" width="150" height="96" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="195" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">2 Registry lookup</text><text x="195" y="116.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">exact entry or</text><text x="195" y="131.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">longest prefix;</text><text x="195" y="146.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">status; unregistered</text><text x="195" y="161.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">→ open/reject</text><path d="M 335 128 L 350 128" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="350" y="80" width="150" height="96" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="360" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">3 Frame</text><text x="360" y="116.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">canonical CBOR decode</text><text x="360" y="131.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">on protected topics</text><path d="M 500 128 L 515 128" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="515" y="80" width="150" height="96" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="525" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">4 Writer proof</text><text x="525" y="116.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">signatures,</text><text x="525" y="131.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">threshold, delegation</text><path d="M 665 128 L 680 128" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="680" y="80" width="150" height="96" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="690" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">5 Replay guard</text><text x="690" y="116.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">statement hash</text><text x="690" y="131.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">unused; notAfter in</text><text x="690" y="146.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">range</text><path d="M 830 128 L 845 128" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="845" y="80" width="150" height="96" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="855" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">6 Payload</text><text x="855" y="116.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">maxPayloadBytes;</text><text x="855" y="131.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">schema IR</text><path d="M 995 128 L 1010 128" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1010" y="80" width="150" height="96" rx="8" fill="#ffffff" stroke="#5b6478" stroke-width="1.4"/><text x="1020" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5b6478" text-anchor="start">7 Machine</text><text x="1020" y="116.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">its own validate /</text><text x="1020" y="131.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">validateForBlock</text><text x="20" y="210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2533" text-anchor="start">Where it runs</text><rect x="20" y="220" width="330" height="70" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="30" y="239.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">Ingress (REST submit, gossip into pool)</text><rect x="370" y="220" width="400" height="70" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="380" y="239.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">Inputs</text><text x="380" y="256.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">committed state at tip · local clock</text><rect x="790" y="220" width="370" height="70" rx="8" fill="#ffffff" stroke="#5b6478" stroke-width="1.4"/><text x="800" y="239.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5b6478" text-anchor="start">On failure</text><text x="800" y="256.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">HTTP 400 with TOPIC_* code; never pooled</text><path d="M 350 255 L 370 255" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 770 255 L 790 255" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="306" width="330" height="70" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="30" y="325.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">Proposer (building a block)</text><rect x="370" y="306" width="400" height="70" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="380" y="325.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">Inputs</text><text x="380" y="342.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">parent state · candidate block time · messages already picked</text><rect x="790" y="306" width="370" height="70" rx="8" fill="#ffffff" stroke="#5b6478" stroke-width="1.4"/><text x="800" y="325.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5b6478" text-anchor="start">On failure</text><text x="800" y="342.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">message dropped from the candidate</text><path d="M 350 341 L 370 341" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 770 341 L 790 341" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="392" width="330" height="70" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="30" y="411.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">Follower (validating a proposal)</text><rect x="370" y="392" width="400" height="70" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="380" y="411.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="start">Inputs</text><text x="380" y="428.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">parent state · proposal block time · earlier messages in the</text><text x="380" y="443.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">block</text><rect x="790" y="392" width="370" height="70" rx="8" fill="#ffffff" stroke="#5b6478" stroke-width="1.4"/><text x="800" y="411.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5b6478" text-anchor="start">On failure</text><text x="800" y="428.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">whole block rejected — no prepare vote</text><path d="M 350 427 L 370 427" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 770 427 L 790 427" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="486" width="1140" height="60" rx="8" fill="#eaf7ef" stroke="#2e8b57" stroke-width="1.4"/><text x="30" y="505.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2e8b57" text-anchor="start">Then, in the block's atomic commit (framework apply, before machines run)</text><text x="30" y="522.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">record used write-statement hashes · count governance approvals · stage registry commands at finalization height + lag · prune expired used/ and revoked/ entries</text></svg>
