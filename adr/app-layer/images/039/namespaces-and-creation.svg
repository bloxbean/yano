<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-label="ADR-039 namespaces, registry entries and the four creation modes"><title>ADR-039 namespaces, registry entries and the four creation modes</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5368"/></marker></defs><rect x="0" y="0" width="1180" height="600" fill="#ffffff"/><text x="20" y="30" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2533" text-anchor="start">Namespaces, entries and how they are created</text><text x="20" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5b6478" text-anchor="start">The policy for a topic is its exact entry, else the longest registered namespace prefix. Only an ancestor's owners can create beneath it, so prefixes never overlap.</text><rect x="30" y="90" width="170" height="54" rx="8" fill="#f6f7f9" stroke="#8a93a6" stroke-width="1.4"/><text x="115.0" y="109.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a93a6" text-anchor="middle">chain root</text><text x="115.0" y="126.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="middle">topics: mode enabled</text><rect x="260" y="80" width="250" height="84" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="270" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">acme/   (namespace)</text><text x="270" y="116.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">owners: A, B (2-of-2) · created by</text><text x="270" y="131.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">governance · writers: open · schema:</text><text x="270" y="146.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">none</text><rect x="580" y="70" width="270" height="84" rx="8" fill="#ffffff" stroke="#5b6478" stroke-width="1.4"/><text x="590" y="89.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5b6478" text-anchor="start">acme/orders   (exact topic)</text><text x="590" y="106.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">writers: {1-of-2: svc1, svc2} · schema:</text><text x="590" y="121.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">order-v1 · maxPayloadBytes 4096</text><rect x="580" y="168" width="270" height="78" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="590" y="187.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">acme/iot/   (sub-namespace)</text><text x="590" y="204.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">created by acme/ owners · owners: C</text><text x="590" y="219.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">(1-of-1) · writers: fleet keys</text><rect x="900" y="168" width="260" height="78" rx="8" fill="#ffffff" stroke="#5b6478" stroke-width="1.4"/><text x="910" y="187.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5b6478" text-anchor="start">acme/iot/telemetry</text><text x="910" y="204.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">inherits writers from acme/iot/ ·</text><text x="910" y="219.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">schema: reading-v1</text><rect x="260" y="290" width="250" height="84" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="270" y="309.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">games/   (namespace)</text><text x="270" y="326.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">owners: P · created by open claim</text><text x="270" y="341.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">(first come) or a registrar</text><rect x="580" y="280" width="270" height="104" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="590" y="299.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">games/neon-rush/   (sub-namespace)</text><text x="590" y="316.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">writers: {1-of-1: issuer} · delegate:</text><text x="590" y="331.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">[issuer] · maxDelegationMs 3,600,000 ·</text><text x="590" y="346.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">schema: ride-v1</text><rect x="900" y="280" width="260" height="104" rx="8" fill="#ffffff" stroke="#5b6478" stroke-width="1.4"/><text x="910" y="299.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5b6478" text-anchor="start">games/neon-rush/s91811</text><text x="910" y="316.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">a season topic; no entry of its own →</text><text x="910" y="331.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">inherits games/neon-rush/ (longest</text><text x="910" y="346.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">prefix)</text><path d="M 200 117 L 260 117" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 200 125 L 230 125 L 230 332 L 260 332" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 510 112 L 580 112" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 510 140 L 545 140 L 545 207 L 580 207" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 850 207 L 900 207" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 510 332 L 580 332" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 850 332 L 900 332" fill="none" stroke="#4a5368" stroke-width="1.5" marker-end="url(#arrow)"/><text x="875" y="294.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">longest</text><text x="875" y="307.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3a4256" text-anchor="middle">prefix</text><rect x="20" y="410" width="1140" height="175" rx="12" fill="none" stroke="#8a93a6" stroke-width="1.4" stroke-dasharray="7 5"/><text x="32" y="428" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8a93a6" text-anchor="start">Who may create a top-level namespace (configured per chain)</text><rect x="40" y="440" width="255" height="130" rx="8" fill="#f3ecff" stroke="#7b4bc4" stroke-width="1.4"/><text x="50" y="459.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#7b4bc4" text-anchor="start">Governance</text><text x="50" y="476.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">threshold-many members submit the</text><text x="50" y="491.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">identical ~governance/topics command</text><text x="50" y="506.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">(ADR-008.3 approval window, activation</text><text x="50" y="521.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">lag)</text><rect x="315" y="440" width="255" height="130" rx="8" fill="#eaf2ff" stroke="#3b6fd8" stroke-width="1.4"/><text x="325" y="459.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3b6fd8" text-anchor="start">Registrar keys</text><text x="325" y="476.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">k-of-n keys in the topic configuration</text><text x="325" y="491.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">sign the create command; rotated by</text><text x="325" y="506.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">governance</text><rect x="590" y="440" width="255" height="130" rx="8" fill="#fdf0f4" stroke="#c0396b" stroke-width="1.4"/><text x="600" y="459.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c0396b" text-anchor="start">Open claim</text><text x="600" y="476.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">anyone, first come: the claim is</text><text x="600" y="491.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">signed by the future owners. From then</text><text x="600" y="506.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">on only those owners create sub-topics</text><text x="600" y="521.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">and rotate keys</text><rect x="865" y="440" width="275" height="130" rx="8" fill="#fff5e6" stroke="#d98a1a" stroke-width="1.4"/><text x="875" y="459.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d98a1a" text-anchor="start">Namespace owner (always)</text><text x="875" y="476.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">owners of a namespace create</text><text x="875" y="491.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">sub-namespaces and topics beneath it,</text><text x="875" y="506.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">update policies and rotate themselves;</text><text x="875" y="521.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b3140" text-anchor="start">governance can recover lost owners</text></svg>
