# Scalus loads its secp256k1 JNI library in the static initializer of scalus.crypto.Secp256k1Context, through scijava's
# NativeLoader (which extracts natives/<platform>/libscalus_secp256k1.* to a temp directory). Quarkus initializes
# classes at build time by default: the library would then be loaded into the image builder only, with enabled=true
# baked into the image, and every secp256k1 builtin would fail at run time with UnsatisfiedLinkError.
Args = --initialize-at-run-time=scalus.crypto.Secp256k1Context,org.scijava.nativelib
