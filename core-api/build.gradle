// Compatibility coordinate: class definitions live in exactly one owning artifact.
dependencies {
    api project(':node-api')
    api project(':host-api')
    api project(':cardano-api')
    api "org.yanoproject.x:yano-x-appchain-api:${providers.gradleProperty('appLedgerFrameworkVersion').getOrElse('0.1.0-245.6')}"
    api "org.yanoproject.x:yano-x-appchain-cardano-api:${providers.gradleProperty('appLedgerFrameworkVersion').getOrElse('0.1.0-245.6')}"
    // Consumer-side compatibility tests still exercise the original aggregate.
    testImplementation libs.cardano.client.core
    testImplementation libs.cardano.client.address
    testImplementation libs.cardano.client.common
    testImplementation libs.cardano.client.crypto
    testImplementation libs.cardano.client.governance
    testImplementation libs.jackson.databind
    testImplementation libs.jackson.dataformat.cbor
}
