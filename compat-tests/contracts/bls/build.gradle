// Compiles the BLS12-381 validator used by the CCL BlsProbe.
// You only need this to REGENERATE the script: BlsProbe embeds the compiled hex,
// so the normal compatibility run does not build this project.
//
//   ./gradlew build   (Java 25 required - julc 0.1.0-pre16 is Java-25-only)
//
// Then paste the emitted hex into BlsProbe.SCRIPT_CBOR_HEX.
plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
}

def julcVersion = '0.1.0-pre16'

dependencies {
    implementation "com.bloxbean.cardano:julc-vm-java:${julcVersion}"
    implementation "com.bloxbean.cardano:julc-cardano-client-lib:${julcVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
