dependencies {
    api project(':ledger-rules')

    implementation(libs.aiken.java.binding) {
        exclude group: 'com.bloxbean.cardano'
    }

    implementation(libs.julc.cardano.client.lib) {
        exclude group: 'com.bloxbean.cardano', module: 'cardano-client-lib'
    }

    implementation(libs.julc.vm.java) {
        exclude group: 'com.bloxbean.cardano', module: 'cardano-client-lib'
    }

    // ADR-056 Phase 7c: the julc ScriptPhaseEvaluator's tests build Conway transactions over the mutation world
    testImplementation testFixtures(project(':ledger-rules'))
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano Script Evaluators'
                description = 'Yano Script Evaluators - Aiken and julc Plutus script evaluators for ExUnits computation, and the julc phase-2 ScriptPhaseEvaluator'
            }
        }
    }
}
