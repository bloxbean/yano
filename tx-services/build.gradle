plugins {
    id 'java-test-fixtures'
}

dependencies {
    api project(':runtime')

    implementation project(':scalus-bridge')
    implementation project(':script-evaluators')

    // ADR-056 Phase 6b / ADR-057 Phase C: the devnet ledger-rules gate (an in-process devnet producer, dependent
    // chains built with QuickTx, independent re-validation of every produced block). Shared with amaru-validator.
    testFixturesApi project(':testkit')
    testFixturesApi project(':scalus-bridge')
    // The independent re-validation runs the default java-julc engine (ADR-056 Phase 7c).
    testFixturesImplementation project(':script-evaluators')
    testFixturesApi libs.junit.jupiter.api
    testFixturesApi libs.cardano.client.quicktx
    testFixturesImplementation libs.jackson.databind
    // RemoteYanoNode: the gate workloads that run against a packaged node use its Blockfrost-shaped REST API.
    testFixturesApi libs.cardano.client.backend.blockfrost
    testImplementation project(':testkit')
    // ADR-056 Phase 7a: a real phase-2-invalid transaction (MutationWorld's always-failing script) through shadow sync.
    testImplementation testFixtures(project(':ledger-rules'))
}

// The test fixtures are a build-time aid for Yano's own gate tests, not a published API.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

tasks.named('test') {
    // ADR-056 Phase 6b devnet gate (JavaEngineDevnetGateTest, about a minute): disabled by default, run with
    // `./gradlew :tx-services:test --tests '*JavaEngineDevnetGateTest' -PledgerRulesGate=true` (CI: integration.yml).
    if (project.hasProperty('ledgerRulesGate')) {
        systemProperty 'yano.gate.devnet', 'true'
    }
    // The Haskell-follower workload (ADR-056 Phase 6b) runs only when pointed at a running node.
    // ADR-056 Phase 7a: ShadowBundleReplayTest replays the shadow bundles in this directory with the java-julc engine.
    // ADR-056 Phase 7c: NativeParityWorkloadTest (qa/harness/ledger-rules-native-parity.sh) against a running node.
    ['yano.gate.remote-url', 'yano.gate.workload-report', 'yano.gate.epoch-length', 'yano.gate.budget-txs',
     'yano.shadow.bundles', 'yano.parity.remote-url', 'yano.parity.report', 'yano.parity.epoch-length',
     'yano.parity.chain-certificates'].each { key ->
        def value = System.getProperty(key)
        if (value != null) {
            systemProperty key, value
        }
    }
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano Transaction Services'
                description = 'Optional transaction validation and script evaluation services for Yano'
            }
        }
    }
}
