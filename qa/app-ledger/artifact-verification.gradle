import groovy.json.JsonOutput
import groovy.xml.XmlSlurper
import org.gradle.api.publish.maven.tasks.GenerateMavenPom
import java.security.MessageDigest

// Applied to :runtime. These tasks observe the exact artifacts used by this build.
def sha256 = { File input ->
    MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString()
}
def artifactInputs = layout.buildDirectory.file('reports/app-ledger/artifact-inputs.json')
def currentPomTasks = rootProject.allprojects.collect { it.tasks.withType(GenerateMavenPom) }
tasks.register('writeAppLedgerArtifactInputs') {
    group = 'verification'
    dependsOn currentPomTasks
    inputs.files(configurations.runtimeClasspath)
    inputs.files(currentPomTasks)
    outputs.file(artifactInputs)
    doLast {
        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .collect { artifact ->
                    [group: artifact.moduleVersion.id.group, name: artifact.name,
                     version: artifact.moduleVersion.id.version, sha256: sha256(artifact.file)]
                }.sort { a, b -> "${a.group}:${a.name}" <=> "${b.group}:${b.name}" }
        if (artifacts.any { it.group == 'org.yanoproject' && it.name == 'yano-core-api' }) {
            throw new GradleException('The current runtime must not depend on the retired yano-core-api aggregate')
        }
        def publicationPoms = currentPomTasks.collectMany { it.toList() }.collect { task ->
            File pomFile = task.destination
            def pom = new XmlSlurper(false, false).parse(pomFile)
            def obsolete = pom.depthFirst().find { node ->
                node.name() == 'dependency' && node.groupId.text() == 'org.yanoproject'
                        && node.artifactId.text() == 'yano-core-api'
            }
            if (obsolete != null) {
                throw new GradleException("Current publication ${task.path} depends on the retired yano-core-api aggregate")
            }
            [task: task.path, sha256: sha256(pomFile)]
        }.sort { it.task }
        def output = artifactInputs.get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [schemaVersion: 1, artifacts: artifacts, publicationPoms: publicationPoms])) + '\n'
    }
}

def baseline = configurations.create('appLedgerApiBaseline') { transitive = false }
def comparator = configurations.create('appLedgerApiComparator') { transitive = false }
dependencies {
    appLedgerApiBaseline 'org.yanoproject:yano-core-api:0.1.0-pre19'
    appLedgerApiComparator 'com.github.siom79.japicmp:japicmp:0.26.5:jar-with-dependencies@jar'
}
def baselineFile = providers.gradleProperty('appLedgerApiBaseline')
def expectedBaseline = 'e8cc29db9c9e36dd743c9ae81bd42e806a4035e87d090d392af017c5f12554e9'
def relocatedFrameworkApis = [
        'org.yanoproject.api.appchain.*', 'org.yanoproject.api.plugin.domain.*',
        'org.yanoproject.api.events.AppBlockFinalizedEvent',
        'org.yanoproject.api.events.AppChainStalledEvent',
        'org.yanoproject.api.events.AppMessageReceivedEvent',
        'org.yanoproject.api.events.AppChainAnchoredEvent']

tasks.register('checkAppLedgerBinaryCompatibility', JavaExec) {
    group = 'verification'
    description = 'Compare unchanged Yano-owned public APIs against the frozen pre19 baseline'
    dependsOn configurations.runtimeClasspath
    classpath = comparator
    mainClass = 'japicmp.JApiCmp'
    inputs.files(configurations.runtimeClasspath)
    inputs.files(provider { baselineFile.isPresent() ? file(baselineFile.get()) : baseline.singleFile })
    def report = layout.buildDirectory.file('reports/app-ledger/api-compatibility.xml')
    outputs.file(report)
    outputs.file(layout.buildDirectory.file('reports/app-ledger/api-baseline.json'))
    doFirst {
        File oldJar = baselineFile.isPresent() ? file(baselineFile.get()) : baseline.singleFile
        if (sha256(oldJar) != expectedBaseline) {
            throw new GradleException('API baseline checksum differs from the frozen pre19 fixture provenance')
        }
        def allJars = configurations.runtimeClasspath.files.toList().sort { it.name }
        def apiNames = ['yano-node-api-', 'yano-host-api-', 'yano-cardano-api-',
                        'yano-x-appchain-api-', 'yano-x-appchain-cardano-api-']
        def newJars = allJars.findAll { file -> apiNames.any { file.name.startsWith(it) } }
        if (newJars.size() != apiNames.size()) {
            throw new GradleException("Expected exactly five API ownership artifacts, found ${newJars}")
        }
        report.get().asFile.parentFile.mkdirs()
        new File(report.get().asFile.parentFile, 'api-baseline.json').text =
                JsonOutput.prettyPrint(JsonOutput.toJson([
                        schemaVersion: 1, baseline: oldJar.name, baselineSha256: sha256(oldJar),
                        scope: 'Yano-owned APIs; renamed framework APIs intentionally excluded',
                        excludedFrameworkApis: relocatedFrameworkApis,
                        comparator: comparator.singleFile.name, comparatorSha256: sha256(comparator.singleFile),
                        newApiArtifacts: newJars.collect { [name: it.name, sha256: sha256(it)] }
                ])) + '\n'
        args = ['--old', oldJar.absolutePath,
                '--new', newJars.collect { it.absolutePath }.join(';'),
                '--old-classpath', (allJars - newJars).collect { it.absolutePath }.join(File.pathSeparator),
                '--new-classpath', allJars.collect { it.absolutePath }.join(File.pathSeparator),
                '--exclude', relocatedFrameworkApis.join(';'),
                '--only-modified', '--error-on-binary-incompatibility', '--error-on-source-incompatibility',
                '--xml-file', report.get().asFile.absolutePath]
    }
}

// Framework Java packages intentionally moved to the X-owned namespace. The
// original pre19 fixture remains historical evidence, not a supported ABI target.
tasks.register('checkFrameworkNamespace') {
    group = 'verification'
    description = 'Verify the resolved framework artifacts use only X-owned Java packages'
    dependsOn configurations.runtimeClasspath
    inputs.files(configurations.runtimeClasspath)
    def report = layout.buildDirectory.file('reports/app-ledger/framework-namespace.json')
    outputs.file(report)
    doLast {
        def jars = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.moduleVersion.id.group == 'org.yanoproject.x'
                        && it.name.startsWith('yano-x-appchain-') }
        if (jars.empty) throw new GradleException('No framework artifacts resolved')
        def checked = jars.collect { artifact ->
            def violations = []
            int classes = 0
            new java.util.zip.ZipFile(artifact.file).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.name.endsWith('.class') && entry.name != 'module-info.class') {
                        classes++
                        if (!entry.name.startsWith('org/yanoproject/x/framework/')) violations.add(entry.name)
                    }
                }
            }
            if (!violations.empty) throw new GradleException("Framework namespace violations in ${artifact.name}: ${violations}")
            [name: artifact.name, sha256: sha256(artifact.file), classes: classes]
        }
        report.get().asFile.parentFile.mkdirs()
        report.get().asFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [schemaVersion: 1, passed: true, artifacts: checked])) + '\n'
    }
}
