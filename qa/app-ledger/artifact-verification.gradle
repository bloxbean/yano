import groovy.json.JsonOutput
import java.security.MessageDigest

// Applied to :runtime. These tasks observe the exact artifacts used by this build.
def sha256 = { File input ->
    MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString()
}
def artifactInputs = layout.buildDirectory.file('reports/app-ledger/artifact-inputs.json')
tasks.register('writeAppLedgerArtifactInputs') {
    group = 'verification'
    inputs.files(configurations.runtimeClasspath)
    outputs.file(artifactInputs)
    doLast {
        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .collect { artifact ->
                    [group: artifact.moduleVersion.id.group, name: artifact.name,
                     version: artifact.moduleVersion.id.version, sha256: sha256(artifact.file)]
                }.sort { a, b -> "${a.group}:${a.name}" <=> "${b.group}:${b.name}" }
        def output = artifactInputs.get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [schemaVersion: 1, artifacts: artifacts])) + '\n'
    }
}

def baseline = configurations.create('appLedgerApiBaseline') { transitive = false }
def comparator = configurations.create('appLedgerApiComparator') { transitive = false }
dependencies {
    appLedgerApiBaseline 'org.yanoproject:yano-core-api:0.1.0-pre19'
    appLedgerApiComparator 'com.github.siom79.japicmp:japicmp:0.26.5:jar-with-dependencies@jar'
}
def baselineFile = providers.gradleProperty('appLedgerApiBaseline')
def expectedBaseline = 'e8cc29db9c9e36dd743c9ae81bd42e806a4035e87d090d392af017c5f12554e9'

tasks.register('checkAppLedgerBinaryCompatibility', JavaExec) {
    group = 'verification'
    description = 'Compare pre19 public API bytecode against the extracted compatibility artifacts'
    dependsOn configurations.runtimeClasspath
    classpath = comparator
    mainClass = 'japicmp.JApiCmp'
    inputs.files(configurations.runtimeClasspath)
    inputs.files(provider { baselineFile.isPresent() ? file(baselineFile.get()) : baseline.singleFile })
    def report = layout.buildDirectory.file('reports/app-ledger/api-compatibility.xml')
    outputs.file(report)
    outputs.file(layout.buildDirectory.file('reports/app-ledger/api-baseline.json'))
    doFirst {
        File oldJar = baselineFile.isPresent() ? file(baselineFile.get()) : baseline.singleFile
        if (sha256(oldJar) != expectedBaseline) {
            throw new GradleException('API baseline checksum differs from the frozen pre19 fixture provenance')
        }
        def allJars = configurations.runtimeClasspath.files.toList().sort { it.name }
        def apiNames = ['yano-core-api-', 'yano-node-api-', 'yano-host-api-', 'yano-cardano-api-',
                        'yano-x-appchain-api-', 'yano-x-appchain-cardano-api-']
        def newJars = allJars.findAll { file -> apiNames.any { file.name.startsWith(it) } }
        if (newJars.size() != apiNames.size()) {
            throw new GradleException("Expected exactly six API ownership artifacts, found ${newJars}")
        }
        report.get().asFile.parentFile.mkdirs()
        new File(report.get().asFile.parentFile, 'api-baseline.json').text =
                JsonOutput.prettyPrint(JsonOutput.toJson([
                        schemaVersion: 1, baseline: oldJar.name, baselineSha256: sha256(oldJar),
                        comparator: comparator.singleFile.name, comparatorSha256: sha256(comparator.singleFile),
                        newApiArtifacts: newJars.collect { [name: it.name, sha256: sha256(it)] }
                ])) + '\n'
        args = ['--old', oldJar.absolutePath,
                '--new', newJars.collect { it.absolutePath }.join(';'),
                '--old-classpath', (allJars - newJars).collect { it.absolutePath }.join(File.pathSeparator),
                '--new-classpath', allJars.collect { it.absolutePath }.join(File.pathSeparator),
                '--only-modified', '--error-on-binary-incompatibility', '--error-on-source-incompatibility',
                '--xml-file', report.get().asFile.absolutePath]
    }
}

// Public runtime classes are used by embedders too: preserve their names, nested
// records and parameter types while their owning artifact changes.
def runtimeBaseline = configurations.create('appLedgerRuntimeBaseline') { transitive = false }
dependencies { appLedgerRuntimeBaseline 'org.yanoproject:yano-runtime:0.1.0-pre19' }
def runtimeBaselineFile = providers.gradleProperty('appLedgerRuntimeBaseline')
tasks.register('checkAppLedgerRuntimeCompatibility', JavaExec) {
    group = 'verification'
    description = 'Compare pre19 public app-chain runtime signatures across extraction'
    dependsOn tasks.named('jar'), configurations.runtimeClasspath
    classpath = comparator
    mainClass = 'japicmp.JApiCmp'
    inputs.files(configurations.runtimeClasspath, tasks.named('jar'))
    inputs.files(provider { runtimeBaselineFile.isPresent() ? file(runtimeBaselineFile.get()) : runtimeBaseline.singleFile })
    def report = layout.buildDirectory.file('reports/app-ledger/runtime-compatibility.xml')
    outputs.file(report)
    outputs.file(layout.buildDirectory.file('reports/app-ledger/runtime-baseline.json'))
    doFirst {
        File oldJar = runtimeBaselineFile.isPresent() ? file(runtimeBaselineFile.get()) : runtimeBaseline.singleFile
        if (sha256(oldJar) != 'd99de754c54816a01b263bf02a4555befeb6623dc3cc633ac19b4299480293ed') {
            throw new GradleException('Runtime baseline checksum differs from the frozen pre19 artifact')
        }
        def allJars = (configurations.runtimeClasspath.files + tasks.named('jar').get().archiveFile.get().asFile)
                .toList().sort { it.name }
        def runtimeNames = ['yano-runtime-', 'yano-x-appchain-core-', 'yano-x-appchain-cardano-']
        def newJars = allJars.findAll { file -> runtimeNames.any { file.name.startsWith(it) }
                && !file.name.startsWith('yano-x-appchain-cardano-api-') }
        if (newJars.size() != 3) throw new GradleException("Expected three runtime ownership artifacts: ${newJars}")
        report.get().asFile.parentFile.mkdirs()
        new File(report.get().asFile.parentFile, 'runtime-baseline.json').text =
                JsonOutput.prettyPrint(JsonOutput.toJson([
                        schemaVersion: 1, baseline: oldJar.name, baselineSha256: sha256(oldJar),
                        comparator: comparator.singleFile.name, comparatorSha256: sha256(comparator.singleFile),
                        newRuntimeArtifacts: newJars.collect { [name: it.name, sha256: sha256(it)] }
                ])) + '\n'
        args = ['--old', oldJar.absolutePath,
                '--new', newJars.collect { it.absolutePath }.join(';'),
                '--old-classpath', (allJars - newJars).collect { it.absolutePath }.join(File.pathSeparator),
                '--new-classpath', allJars.collect { it.absolutePath }.join(File.pathSeparator),
                '--include', 'org.yanoproject.runtime.appchain.*',
                '--only-modified', '--error-on-binary-incompatibility', '--error-on-source-incompatibility',
                '--xml-file', report.get().asFile.absolutePath]
    }
}
