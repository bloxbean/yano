// Manifest-required contribution kinds need an owning bundle manifest from an
// embedded aggregate index. Generate the index over the test runtime
// classpath (dependency jars plus this module's own test providers, merged
// into one artifact) so catalog-opening tests see the same
// authoritative-input shape as packaged runtimes.
def generatedTestPluginCatalogDir =
        layout.buildDirectory.dir('generated/test-plugin-catalog')

tasks.register('testCatalogProvidersJar', Jar) {
    archiveClassifier = 'test-catalog-providers'
    destinationDirectory = layout.buildDirectory.dir('generated/test-plugin-catalog-jar')
    from sourceSets.test.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('generateTestPluginCatalogIndex', JavaExec) {
    dependsOn project(':plugin-catalog').tasks.named('classes'),
            tasks.named('testCatalogProvidersJar'), tasks.named('jar')
    inputs.files(configurations.testRuntimeClasspath)
    inputs.file(tasks.named('testCatalogProvidersJar').flatMap { it.archiveFile })
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    outputs.file(generatedTestPluginCatalogDir.map {
        it.file('META-INF/yano-plugin-index-v1.json')
    })
    classpath = project(':plugin-catalog').sourceSets.main.runtimeClasspath
    mainClass = 'org.yanoproject.catalog.PluginIndexGenerator'
    doFirst {
        def output = generatedTestPluginCatalogDir.get()
                .file('META-INF/yano-plugin-index-v1.json').asFile
        output.parentFile.mkdirs()
        def artifacts = configurations.testRuntimeClasspath.files
                .findAll { it.exists() && it.name.endsWith('.jar') }
                .sort { left, right -> left.absolutePath <=> right.absolutePath }
        def providersJar = tasks.named('testCatalogProvidersJar').get()
                .archiveFile.get().asFile
        def moduleJar = tasks.named('jar').get().archiveFile.get().asFile
        def arguments = ['--output', output.absolutePath, '--'] +
                artifacts.collect { it.absolutePath } +
                [moduleJar.absolutePath, providersJar.absolutePath]
        // Same Windows 32k command-line limit as :app:generatePluginCatalogIndex.
        def argumentsFile = new File(temporaryDir, 'test-plugin-index-args.txt')
        argumentsFile.parentFile.mkdirs()
        argumentsFile.setText(arguments.join('\n') + '\n', 'UTF-8')
        args = ['--args-file', argumentsFile.absolutePath]
    }
}

// Catalog-semantics tests build and inject their own catalog inputs
// (including explicit embedded indexes), so they must run WITHOUT the
// generated classpath index — an extra index is a hard cardinality error.
def catalogSemanticsTestClasses = [
        '**/plugins/PluginCatalogRuntimeTest.class',
        '**/plugins/PluginCatalogCollisionPolicyTest.class',
]

tasks.named('test') {
    dependsOn tasks.named('generateTestPluginCatalogIndex')
    classpath += files(generatedTestPluginCatalogDir)
    catalogSemanticsTestClasses.each { exclude it }
    // ADR-056 Phase 6a mempool budget microbenchmark: disabled by default,
    // run with `./gradlew :runtime:test --tests '*LedgerMempoolBudgetTest' -PmempoolBenchmark=true`.
    if (project.hasProperty('mempoolBenchmark')) {
        systemProperty 'yano.mempool.benchmark', 'true'
        maxHeapSize = '4g'
    }
    doFirst {
        systemProperty 'yano.test.runtime-classpath', classpath.asPath
    }
}

tasks.register('pluginCatalogSemanticsTest', Test) {
    dependsOn ':utxo-output-index-example:jar'
    doFirst {
        systemProperty 'yano.test.utxo-index-example-jar', project(':utxo-output-index-example')
                .tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    }
    group = 'verification'
    description = 'Catalog-semantics tests that manage their own catalog inputs (no embedded index)'
    useJUnitPlatform()
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    catalogSemanticsTestClasses.each { include it }
}

tasks.named('check') {
    dependsOn tasks.named('pluginCatalogSemanticsTest')
}


java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yano Runtime'
                description = 'Runtime implementation for Yano (A Cardano Node implementation in Java)'
            }
        }
    }
}

// Explicit invocation only; the destination must not exist. This is a synthetic
// index/storage spike, not a substitute for historical-chain sync measurements.
tasks.register('benchmarkWalletIndexes', JavaExec) {
    group = 'verification'
    description = 'Measures four optional-wallet-index modes on physically stored synthetic blocks'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.yanoproject.runtime.wallet.WalletIndexBenchmark'
    maxHeapSize = '1g'
    args providers.gradleProperty('walletBenchmarkDirectory').getOrElse('/private/tmp/yano-wallet-index-benchmark'),
            providers.gradleProperty('walletBenchmarkBlocks').getOrElse('1000000')
}

// Read-only source, fresh derived databases. Includes canonical body decode and UTxO
// processing, but not network/consensus/other ledger-store costs of full-node sync.
tasks.register('benchmarkWalletHistory', JavaExec) {
    group = 'verification'
    description = 'Replays retained historical blocks through the four wallet-index modes'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.yanoproject.runtime.wallet.WalletHistoricalBenchmark'
    maxHeapSize = '1g'
    args providers.gradleProperty('walletHistorySource').getOrElse(''),
            providers.gradleProperty('walletHistoryOutput').getOrElse(''),
            providers.gradleProperty('walletHistoryGenesis').getOrElse(''),
            providers.gradleProperty('walletHistoryBlocks').getOrElse('1000000')
}

// Exports a completed historical replay and real scan results for the raw-CBOR oracle.
tasks.register('verifyWalletHistory', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.yanoproject.runtime.wallet.WalletHistoricalVerifier'
    maxHeapSize = '1g'
    args providers.gradleProperty('walletVerifyDatabase').getOrElse(''),
            providers.gradleProperty('walletVerifyOutput').getOrElse('')
}

