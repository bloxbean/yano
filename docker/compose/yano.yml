name: yano-${INSTANCE_NAME:-default}

services:
  yano:
    image: ${YANO_IMAGE:-bloxbean/yano}:${YANO_IMAGE_TAG:-latest}-${YANO_IMAGE_FLAVOR:-jvm}
    container_name: yano-${INSTANCE_NAME:-default}
    user: "${YANO_UID:-1000}:${YANO_GID:-1000}"
    env_file:
      - ../config/env
    environment:
      YANO_PROFILE: ${YANO_PROFILE:-preprod}
      YANO_NETWORK: ${YANO_NETWORK:-preprod}
      JAVA_OPTS: ${JAVA_OPTS:-}
      YANO_NATIVE_MAX_HEAP: ${YANO_NATIVE_MAX_HEAP:-1536m}
      YANO_EXTRA_ARGS: ${YANO_EXTRA_ARGS:-}
      # Fixed by the mounts below; these override any older value in config/env.
      YANO_STORAGE_PATH: /app/data/chainstate
      YANO_HISTORY_DIR: /app/data/history
    ports:
      - "${YANO_HTTP_PORT:-7070}:7070"
      - "${YANO_N2N_PORT:-13337}:13337"
    volumes:
      - ${YANO_RUNTIME_DATA_PATH:-../data-preprod/runtime-data}:/app/data
      - ${YANO_CHAINSTATE_PATH:-../data-preprod/chainstate}:/app/data/chainstate
      - ${YANO_APPCHAIN_STATE_PATH:-../data-preprod/appchain-chainstate}:/app/appchain-chainstate
      - ${YANO_APPCHAIN_INDEXER_PATH:-../data-preprod/appchain-indexers}:/app/appchain-indexers
      - ../logs:/app/logs
      - ../config:/app/config:ro
      # Network files must remain writable for seeding and devnet genesis updates.
      - ../config/network:/app/config/network
      - ../plugins:/app/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7070/q/health/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "20"
