services:
  yano:
    environment:
      YANO_PROFILE: ${YANO_PROFILE:-mainnet}
      YANO_NETWORK: ${YANO_NETWORK:-mainnet}
    volumes:
      - ${YANO_RUNTIME_DATA_PATH:-../runtime-data-mainnet}:/app/data
      - ${YANO_CHAINSTATE_PATH:-../chainstate-mainnet}:/app/data/chainstate
      - ${YANO_APPCHAIN_STATE_PATH:-../appchain-chainstate-mainnet}:/app/appchain-chainstate
      - ${YANO_APPCHAIN_INDEXER_PATH:-../appchain-indexers-mainnet}:/app/appchain-indexers
