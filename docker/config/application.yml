quarkus:
  http:
    host: 0.0.0.0
    port: 7070
  log:
    file:
      enabled: true
      path: /app/logs/yano.log

yano:
  plugins:
    directory: /app/plugins
  storage:
    path: /app/chainstate
  app-chain:
    storage:
      path: /app/appchain-chainstate
    indexer:
      storage:
        path: /app/appchain-indexers
