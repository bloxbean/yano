// ADR-056 §8: the conformance harness. Test-only: no main sources, never published (see the end of this
// file and centralDeploymentExclusions in the root build).
//
// It is a module of its own, not the `conformanceTest` source set of ledger-rules the ADR first described,
// because it runs every engine side by side: scalus-bridge depends on ledger-rules, so ledger-rules cannot
// depend on it.
//
//   ./gradlew :ledger-conformance:test                  runner, coverage matrix and mutation matrix; the
//                                                       scenario parts skip without the Amaru corpus
//   -PamaruScenariosDir=<amaru clone or its            the 368 Amaru scenarios (or AMARU_SCENARIOS_DIR), at the tag
//      crates/amaru-ledger/tests/data/transaction>     AMARU_TAG in node-diversity/corpora.env (fetch-corpora.sh
//                                                       fetches it to <dir>/amaru)
//   ./gradlew :ledger-conformance:conformanceReport ... regenerates docs/baseline-2026-09.md,
//                                                       docs/blueprint-vectors-2026-09.md and
//                                                       ledger-rules/docs/conway-rule-coverage.md
//                                                       (the -2026-09 suffix names the series start; each
//                                                       report's "Generated" header is authoritative)
//   -Pconformance.strict=false                         report missing coverage instead of failing (strict is the
//                                                       default since the ADR-056 Phase 5 gate)
//   -PblueprintVectors=<dir>                           another copy of the cardano-blueprint vectors (default: the
//                                                       vendored vectors/cardano-blueprint, see its README.md)
//   -PengineBenchmark=true                             EngineLatencyBenchmarkTest: warm p50/p99 per engine on the
//                                                       Amaru scenarios and the preprod/preview replay bundles
//   ./gradlew :ledger-conformance:nodeDiversityReports  ADR-060: the Cardano node-diversity reports, written to
//      -PnodeDiversityCorpora=<dir>                     build/node-diversity/yano-<version>-<yyyymmdd>-<scenario>.json
//                                                       (or NODE_DIVERSITY_CORPORA; the corpora that
//                                                       ledger-conformance/node-diversity/fetch-corpora.sh fetches)

description = 'ADR-056 conformance harness: Amaru scenarios, coverage matrix, mutation matrix, engine baseline'

dependencies {
    testImplementation project(':ledger-rules')
    testImplementation testFixtures(project(':ledger-rules'))
    testImplementation project(':scalus-bridge')
    // ADR-056 Phase 7c: the julc phase-2 evaluator of the java engine
    testImplementation project(':script-evaluators')
    // ADR-060 §4-5: the UPLC reports call julc's CEK machine directly, as script-evaluators' JulcMachine does
    testImplementation libs.julc.vm.java
    // ADR-060 §6: the cbor-decoding report reads headers as chain sync and upstream header validation do
    testImplementation project(':runtime')
    testImplementation libs.jackson.databind
    testImplementation libs.cardano.client.address
}

def scenariosDir = providers.gradleProperty('amaruScenariosDir')
        .orElse(providers.environmentVariable('AMARU_SCENARIOS_DIR')).getOrElse('')

// ADR-056 Phase 7b: the cardano-blueprint ledger conformance vectors, vendored under vectors/cardano-blueprint
// (README.md there has the pin and how to update it). -PblueprintVectors=<dir> points the tests at another extracted
// copy (a directory holding eras/ and pparams/, or an Amaru checkout); the tests check the files against the pinned
// corpus digest either way.
def blueprintVectorsDir = providers.gradleProperty('blueprintVectors')
        .orElse(providers.environmentVariable('BLUEPRINT_VECTORS')).getOrElse('')
        ?: file('vectors/cardano-blueprint').absolutePath
// ADR-060: the pinned corpora of the node-diversity reports (node-diversity/corpora.env).
def nodeDiversityCorpora = providers.gradleProperty('nodeDiversityCorpora')
        .orElse(providers.environmentVariable('NODE_DIVERSITY_CORPORA')).getOrElse('')
// A pin of node-diversity/corpora.env: the node-diversity corpora (ADR-060) and the Amaru scenarios' tag (ADR-062 D5).
def corpusPin = { String name -> (file('node-diversity/corpora.env').text =~ /(?m)^${name}=(\S+)/)[0][1] }
// Strict since the ADR-056 Phase 5 gate: an in-scope constructor without a @Covers test fails the build.
def strict = providers.gradleProperty('conformance.strict').getOrElse('true')

tasks.withType(Test).configureEach {
    if (scenariosDir) {
        systemProperty 'amaru.scenarios.dir', scenariosDir
    }
    systemProperty 'blueprint.vectors.dir', blueprintVectorsDir
    systemProperty 'conformance.strict', strict
    systemProperty 'conformance.amaruTag', corpusPin('AMARU_TAG')
    // Test classes of other modules scanned for @Covers (ledger-rules' rule tests from Phase 3 on).
    systemProperty 'conformance.scan.dirs',
            project(':ledger-rules').layout.buildDirectory.dir('classes/java/test').get().asFile.absolutePath
    systemProperty 'conformance.report.dir', layout.buildDirectory.dir('conformance').get().asFile.absolutePath
    if (nodeDiversityCorpora) {
        systemProperty 'node.diversity.corpora', file(nodeDiversityCorpora).absolutePath
        // The cbor-decoding report names both commits.
        systemProperty 'node.diversity.cborDatasetCommit', corpusPin('CBOR_DATASET_REVISION')
        systemProperty 'node.diversity.commit',
                providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()
    }
    systemProperty 'node.diversity.report.dir', layout.buildDirectory.dir('node-diversity').get().asFile.absolutePath
    // CborRuleTest's valid Conway block (runtime's test resources)
    systemProperty 'node.diversity.conwayBlock',
            rootProject.file('runtime/src/test/resources/wallet/eras/conway2.block').absolutePath
    systemProperty 'node.diversity.version', project.version.toString()
    // ADR-057 Phase E engine latency benchmark (EngineLatencyBenchmarkTest): -PengineBenchmark=true, optionally
    // -PengineBenchmarkPasses=<n> (default 5) and -PengineBenchmarkWarmup=<n> (default 2); the public-network corpus runs
    // -PengineBenchmarkNetworkRepeat=<n> (default 20) times as many passes of each.
    if (project.hasProperty('engineBenchmark')) {
        systemProperty 'yano.engine.benchmark', 'true'
        systemProperty 'yano.engine.benchmark.passes', providers.gradleProperty('engineBenchmarkPasses').getOrElse('5')
        systemProperty 'yano.engine.benchmark.warmup', providers.gradleProperty('engineBenchmarkWarmup').getOrElse('2')
        systemProperty 'yano.engine.benchmark.networkRepeat',
                providers.gradleProperty('engineBenchmarkNetworkRepeat').getOrElse('20')
    }
    dependsOn ':ledger-rules:testClasses'
    // The results depend on the external Amaru corpus and on engines outside this module: always run.
    outputs.cacheIf { false }
    outputs.upToDateWhen { false }
}

tasks.register('conformanceReport', Test) {
    group = 'verification'
    description = 'Regenerates the ADR-056 baseline report and the Conway rule coverage matrix (needs the Amaru scenarios).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching '*ConformanceBaselineTest'
        includeTestsMatching '*CoverageMatrixTest'
        includeTestsMatching '*BlueprintVectorGateTest'
    }
    systemProperty 'conformance.writeDocs', 'true'
    systemProperty 'conformance.baseline.file', file('docs/baseline-2026-09.md').absolutePath
    systemProperty 'conformance.coverage.file', rootProject.file('ledger-rules/docs/conway-rule-coverage.md').absolutePath
    systemProperty 'conformance.blueprint.file', file('docs/blueprint-vectors-2026-09.md').absolutePath
    doFirst {
        if (!scenariosDir) {
            throw new GradleException('conformanceReport needs the Amaru scenarios: pass -PamaruScenariosDir=<dir> ' +
                    'or set AMARU_SCENARIOS_DIR (a clone of pragma-org/amaru at AMARU_TAG in node-diversity/corpora.env)')
        }
    }
}

// The report generators run only in nodeDiversityReports; their unit tests run in test.
tasks.named('test', Test) {
    filter {
        excludeTestsMatching '*DiversityReportTest'
    }
}

tasks.register('nodeDiversityReports', Test) {
    group = 'verification'
    description = 'ADR-060: writes the Cardano node-diversity conformance reports (needs -PnodeDiversityCorpora).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching '*DiversityReportTest'
    }
    maxHeapSize = '4g'
    testLogging {
        showStandardStreams = true
    }
    doFirst {
        if (!nodeDiversityCorpora) {
            throw new GradleException('nodeDiversityReports needs the corpora: pass -PnodeDiversityCorpora=<dir> or '
                    + 'set NODE_DIVERSITY_CORPORA (ledger-conformance/node-diversity/fetch-corpora.sh <dir> fetches '
                    + 'them)')
        }
    }
}

// Never published: a test harness.
def conformancePublication = publishing.publications.findByName('mavenJava')
if (conformancePublication != null) {
    publishing.publications.remove(conformancePublication)
}
tasks.withType(PublishToMavenRepository).configureEach {
    enabled = false
}
tasks.withType(PublishToMavenLocal).configureEach {
    enabled = false
}
