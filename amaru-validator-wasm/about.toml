# cargo-about configuration: generates THIRD-PARTY-LICENSES.txt for the published bundle
# (scripts/build-wasm.sh --bundle; ADR-057 §3 "Licensing"). The accepted set mirrors deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
]
# What ships is the wasm32-wasip1 module: its normal dependency graph only.
targets = ["wasm32-wasip1"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
